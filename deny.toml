# A-7: cargo-deny policy. CI integration is the WP4 follow-up
# (the audit notes "Add a CI gate when CI is introduced" — Axis 6
# T-1). This file is the policy artefact that gate will read.
#
# Re-check the duplicates state any time deps move:
#   cargo install cargo-deny
#   cargo deny check duplicates licenses advisories
#
# Compared to the audit's snapshot:
#   syn 1.x:        2 versions → 1   (deduped since audit)
#   windows-sys:    4 versions → 3   (-1)
#   hashbrown:      3 versions → 2   (-1)
#   rand:           3 versions → 3   (unchanged — intrinsic, see `skip` below)

[advisories]
# A-7 / S-7: every known advisory denies by default. CI's
# `cargo deny check advisories` is the canonical version of S-7's
# `cargo audit` step (WP4 wires it).
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 — `rsa` "Marvin Attack" timing sidechannel,
  # no upstream fix available. Pulled in transitively by
  # `sqlx-postgres` for password authentication. We connect to
  # Postgres over the Docker bridge / pgBouncer — there is no
  # public-internet RSA exposure for the auth path, and TLS is
  # rustls-only (does not use the rsa crate). Tracked in the
  # impact log; re-evaluate when the `rsa` crate publishes a fix
  # or when sqlx-postgres swaps in a constant-time alternative.
  # This is the same disposition large Rust projects (sqlx,
  # sea-orm, several Microsoft repos) have adopted for this
  # advisory.
  "RUSTSEC-2023-0071",
]

[licenses]
# Conservative allowlist of OSS-permissive licenses + a few
# specific exceptions for crypto/Unicode tables that are widely
# used and accepted at the SaaS bar.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  # CDLA-Permissive-2.0 — used by `webpki-roots` (the rustls
  # bundle of Mozilla CA certificates). Permissive Linux
  # Foundation license; OSI-equivalent for data + code.
  "CDLA-Permissive-2.0",
  # BSL-1.0 — Boost Software License 1.0; OSI-approved
  # permissive license. Used by `xxhash-rust` (transitive via
  # the testcontainers / sqlx hot path).
  "BSL-1.0",
]

# Our own workspace crates (accounts/app/notifications/shared_kernel/
# transactions) deliberately do not carry `license = "..."` in their
# Cargo.toml because they are internal — never published to crates.io.
# cargo-deny otherwise flags them as `unlicensed`. The `private`
# table tells it to skip path-dep / workspace-internal crates.

[licenses.private]
ignore = true

[bans]
# Warn on duplicate versions so new ones are visible in PRs. The
# `skip` list below acknowledges the irreducible duplications that
# come from upstream ecosystem version skew (rand 0.8 via sqlx,
# 0.9 via metrics-util + opentelemetry_sdk, 0.10 via uuid — three
# different crates each on a different active major). Bumping sqlx
# to a version that ships rand 0.9 is API-breaking; the audit's
# own remediation note: "occasionally pin a transitive dep via
# [patch.crates-io] for unmaintained crates" — none of these are
# unmaintained, just on different release cadences.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

# Known-acceptable duplicates as of 2026-05-18. Anything outside
# this list trips the cargo-deny CI check.
skip = [
  # rand ecosystem skew — three active majors, each pulled by a
  # different upstream that won't all update on the same cadence.
  { crate = "rand:0.8.5",      reason = "via sqlx-postgres 0.8.x — bumping sqlx is API-breaking" },
  { crate = "rand:0.9.2",      reason = "via metrics-util 0.20 + opentelemetry_sdk 0.31 + testcontainers (dev)" },
  { crate = "rand_chacha:0.3", reason = "rand 0.8.x dep tree" },
  { crate = "rand_core:0.6",   reason = "rand 0.8.x dep tree" },
  { crate = "rand_core:0.9",   reason = "rand 0.9.x dep tree" },
  # Windows FFI bindings — windows-sys major bumps lag tokio's
  # cadence; effectively zero runtime cost on Linux container.
  { crate = "windows-sys:0.48",     reason = "via etcetera 0.8 (sqlx transitive)" },
  { crate = "windows-sys:0.60",     reason = "via tokio + redis + hyper-util" },
  # hashbrown: 0.15 is from older deps, 0.16 is current.
  { crate = "hashbrown:0.15", reason = "transitive via older deps; current crates use 0.16" },
  # windows-targets:0.48 and base64:0.21 dropped from skip list:
  # `cargo update` (WP4 pre-flight) dedup'd both out of the tree.
  # cargo-deny's unmatched-skip warning would page if a future
  # transitive re-introduces them.
  # getrandom: 0.2 / 0.3 / 0.4 — three rand-family transitive paths.
  { crate = "getrandom:0.2", reason = "rand 0.8.x transitive" },
  { crate = "getrandom:0.3", reason = "rand 0.9.x transitive" },
]

[graph]
# Limit dep-graph traversal to the target triples the binary
# actually ships on. Avoids false-positive windows-sys duplicates
# when running cargo-deny on a Linux CI runner.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
]

[sources]
# Only crates.io. Local-path + workspace-internal allowed by
# default.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
