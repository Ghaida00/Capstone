name: peakload

# ============================================================
# Shared config via YAML anchors
# ============================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-pg-common: &pg-common
  image: postgres:18.3-alpine3.23
  restart: unless-stopped
  logging: *default-logging
  networks:
    - peakload-network

x-pg-primary-env: &pg-primary-env
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_INITDB_ARGS: "--data-checksums"
  REPL_PASSWORD: ${REPL_PASSWORD:?set REPL_PASSWORD in .env}

x-pg-primary-command: &pg-primary-command >
  postgres
    -c wal_level=replica
    -c max_wal_senders=10
    -c max_replication_slots=10
    -c hot_standby=on
    -c shared_buffers=64MB
    -c effective_cache_size=192MB
    -c work_mem=4MB
    -c maintenance_work_mem=32MB
    -c max_connections=120
    -c checkpoint_completion_target=0.9
    -c random_page_cost=1.1

x-pg-healthcheck: &pg-healthcheck
  test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 15s

x-pg-replica-healthcheck: &pg-replica-healthcheck
  test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 30s

x-pg-primary-deploy: &pg-primary-deploy
  resources:
    limits:
      memory: 256M
      cpus: "0.5"

x-pg-replica-deploy: &pg-replica-deploy
  resources:
    limits:
      memory: 256M
      cpus: "0.25"

x-pgbouncer-common: &pgbouncer-common
  image: edoburu/pgbouncer:v1.25.1-p0
  restart: unless-stopped
  logging: *default-logging
  networks:
    - peakload-network
  expose:
    - "5432"

x-pgbouncer-env: &pgbouncer-env
  AUTH_TYPE: scram-sha-256
  POOL_MODE: transaction
  DEFAULT_POOL_SIZE: 40
  MAX_CLIENT_CONN: 500
  MAX_DB_CONNECTIONS: 100
  MIN_POOL_SIZE: 15
  RESERVE_POOL_SIZE: 10
  RESERVE_POOL_TIMEOUT: 3
  SERVER_IDLE_TIMEOUT: 300
  SERVER_LIFETIME: 3600
  LOG_CONNECTIONS: 0
  LOG_DISCONNECTIONS: 0

x-pgbouncer-healthcheck: &pgbouncer-healthcheck
  test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER}" ]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 10s

x-pgbouncer-deploy: &pgbouncer-deploy
  resources:
    limits:
      memory: 32M
      cpus: "0.1"

x-redis-command: &redis-command >
  redis-server
    --maxmemory 96mb
    --maxmemory-policy allkeys-lru
    --save ""
    --appendonly no
    --tcp-backlog 511
    --tcp-keepalive 300
    --hz 100
    --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    --masterauth ${REDIS_PASSWORD}

x-redis-healthcheck: &redis-healthcheck
  test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 5s

x-sentinel-common: &sentinel-common
  image: redis:8.6.1-alpine3.23
  restart: unless-stopped
  logging: *default-logging
  networks:
    - peakload-network
  volumes:
    - ./redis/sentinel.conf:/tmp/sentinel.conf:ro
  command: >
    sh -c "cp /tmp/sentinel.conf /etc/sentinel.conf &&
           chmod 644 /etc/sentinel.conf &&
           redis-sentinel /etc/sentinel.conf"
  depends_on:
    redis-master:
      condition: service_healthy
  expose:
    - "26379"
  healthcheck:
    test: [ "CMD", "redis-cli", "-p", "26379", "ping" ]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s
  deploy:
    resources:
      limits:
        memory: 32M
        cpus: "0.1"

services:
  # ============================================================
  # Nginx — Reverse Proxy & Load Balancer
  # ============================================================
  nginx:
    image: nginx:1.29.6-alpine3.23-slim
    container_name: peakload-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ============================================================
  # Rust Application — 2 replicas
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # ── Failover wiring ─────────────────────────────────────────
      # Sentinel-aware Redis client: when these are set the app
      # resolves the Redis master via Sentinel and rebuilds its pool
      # automatically when Sentinel promotes a replica.
      REDIS_SENTINEL_NODES: "redis://redis-sentinel-1:26379,redis://redis-sentinel-2:26379,redis://redis-sentinel-3:26379"
      REDIS_SENTINEL_MASTER_NAME: "peakload-master"
      REDIS_SENTINEL_MONITOR_INTERVAL_SECS: "5"
      # Per-replica health probe interval for Postgres
      DB_HEALTH_CHECK_INTERVAL_SECS: "5"
      # Retry policy for transient write errors (pgBouncer reconnect window)
      DB_WRITE_RETRY_MAX_ATTEMPTS: "3"
      DB_WRITE_RETRY_BACKOFF_MS: "50"
    expose:
      - "3000"
    depends_on:
      pgbouncer-shard0:
        condition: service_healthy
      pgbouncer-shard1:
        condition: service_healthy
      pgbouncer-shard2:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/app/peakload-capstone", "--health-check" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ============================================================
  # SHARD 0 — PostgreSQL Primary + 1 Replica + pgBouncer
  # ============================================================
  pg-shard0-primary:
    <<: *pg-common
    container_name: peakload-pg-shard0-primary
    environment: *pg-primary-env
    command: *pg-primary-command
    volumes:
      - pg_shard0_primary_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/primary-setup.sh:/docker-entrypoint-initdb.d/02-primary-setup.sh:ro
    healthcheck: *pg-healthcheck
    deploy: *pg-primary-deploy

  pg-shard0-replica1:
    <<: *pg-common
    container_name: peakload-pg-shard0-replica1
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PRIMARY_HOST: pg-shard0-primary
      REPL_PASSWORD: ${REPL_PASSWORD}
    volumes:
      - pg_shard0_replica1_data:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: [ "/bin/sh", "/replica-entrypoint.sh" ]
    depends_on:
      pg-shard0-primary:
        condition: service_healthy
    healthcheck: *pg-replica-healthcheck
    deploy: *pg-replica-deploy

  pgbouncer-shard0:
    <<: *pgbouncer-common
    container_name: peakload-pgbouncer-shard0
    environment:
      <<: *pgbouncer-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg-shard0-primary:5432/${POSTGRES_DB}
    depends_on:
      pg-shard0-primary:
        condition: service_healthy
    healthcheck: *pgbouncer-healthcheck
    deploy: *pgbouncer-deploy

  # ============================================================
  # SHARD 1 — PostgreSQL Primary + 1 Replica + pgBouncer
  # ============================================================
  pg-shard1-primary:
    <<: *pg-common
    container_name: peakload-pg-shard1-primary
    environment: *pg-primary-env
    command: *pg-primary-command
    volumes:
      - pg_shard1_primary_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/primary-setup.sh:/docker-entrypoint-initdb.d/02-primary-setup.sh:ro
    healthcheck: *pg-healthcheck
    deploy: *pg-primary-deploy

  pg-shard1-replica1:
    <<: *pg-common
    container_name: peakload-pg-shard1-replica1
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PRIMARY_HOST: pg-shard1-primary
      REPL_PASSWORD: ${REPL_PASSWORD}
    volumes:
      - pg_shard1_replica1_data:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: [ "/bin/sh", "/replica-entrypoint.sh" ]
    depends_on:
      pg-shard1-primary:
        condition: service_healthy
    healthcheck: *pg-replica-healthcheck
    deploy: *pg-replica-deploy

  pgbouncer-shard1:
    <<: *pgbouncer-common
    container_name: peakload-pgbouncer-shard1
    environment:
      <<: *pgbouncer-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg-shard1-primary:5432/${POSTGRES_DB}
    depends_on:
      pg-shard1-primary:
        condition: service_healthy
    healthcheck: *pgbouncer-healthcheck
    deploy: *pgbouncer-deploy

  # ============================================================
  # SHARD 2 — PostgreSQL Primary + 1 Replica + pgBouncer
  # ============================================================
  pg-shard2-primary:
    <<: *pg-common
    container_name: peakload-pg-shard2-primary
    environment: *pg-primary-env
    command: *pg-primary-command
    volumes:
      - pg_shard2_primary_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/primary-setup.sh:/docker-entrypoint-initdb.d/02-primary-setup.sh:ro
    healthcheck: *pg-healthcheck
    deploy: *pg-primary-deploy

  pg-shard2-replica1:
    <<: *pg-common
    container_name: peakload-pg-shard2-replica1
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PRIMARY_HOST: pg-shard2-primary
      REPL_PASSWORD: ${REPL_PASSWORD}
    volumes:
      - pg_shard2_replica1_data:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: [ "/bin/sh", "/replica-entrypoint.sh" ]
    depends_on:
      pg-shard2-primary:
        condition: service_healthy
    healthcheck: *pg-replica-healthcheck
    deploy: *pg-replica-deploy

  pgbouncer-shard2:
    <<: *pgbouncer-common
    container_name: peakload-pgbouncer-shard2
    environment:
      <<: *pgbouncer-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg-shard2-primary:5432/${POSTGRES_DB}
    depends_on:
      pg-shard2-primary:
        condition: service_healthy
    healthcheck: *pgbouncer-healthcheck
    deploy: *pgbouncer-deploy

  # ============================================================
  # Redis HA — Master + Replica + Sentinel
  # ============================================================
  redis-master:
    image: redis:8.6.1-alpine3.23
    container_name: peakload-redis-master
    command: *redis-command
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck: *redis-healthcheck
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  redis-replica:
    image: redis:8.6.1-alpine3.23
    container_name: peakload-redis-replica
    command: >
      redis-server
        --maxmemory 96mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --tcp-backlog 511
        --tcp-keepalive 300
        --hz 100
        --requirepass ${REDIS_PASSWORD}
        --masterauth ${REDIS_PASSWORD}
        --replicaof redis-master 6379
    expose:
      - "6379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck: *redis-healthcheck
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  redis-sentinel-1:
    <<: *sentinel-common
    container_name: peakload-redis-sentinel-1

  redis-sentinel-2:
    <<: *sentinel-common
    container_name: peakload-redis-sentinel-2

  redis-sentinel-3:
    <<: *sentinel-common
    container_name: peakload-redis-sentinel-3

  # ============================================================
  # RabbitMQ — Async Message Queue
  # ============================================================
  rabbitmq:
    image: rabbitmq:4.2.4-alpine
    container_name: peakload-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: /
    expose:
      - "5672"
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ============================================================
  # Prometheus — Metrics Collection
  # ============================================================
  # NOTE: No healthcheck is defined on purpose.
  #
  # The `*-distroless` image ships ONLY the `prometheus` binary — no
  # shell, no `wget`, no `curl`, no `busybox`. Any healthcheck that
  # shells out (e.g. `wget http://localhost:9090/-/healthy`) will exec-
  # fail every probe → container stuck `(unhealthy)` → every service
  # with `depends_on: prometheus: condition: service_healthy` (notably
  # Grafana) will refuse to start with:
  #     "dependency prometheus failed to start"
  #
  # Do NOT re-add a wget/curl healthcheck unless you also drop the
  # `-distroless` suffix from the image tag. If you need dependency
  # ordering for Grafana, use `condition: service_started` (already
  # set on the Grafana service below) — Prometheus start-up is
  # deterministic and does not need a readiness gate here.
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.10.0-distroless
    container_name: peakload-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ============================================================
  # Grafana — Metrics Visualization
  # ============================================================
  grafana:
    image: grafana/grafana:12.3
    container_name: peakload-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?set GRAFANA_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Grafana waits for Prometheus to START, not to be HEALTHY, because
    # the Prometheus service has no healthcheck (see comment above the
    # prometheus service for why). Prometheus start-up is deterministic
    # enough that this is safe — Grafana's own datasource provisioning
    # tolerates a Prometheus that isn't answering scrapes yet.
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ============================================================
  # cAdvisor — Per-Container Resource Monitoring
  # ============================================================
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: peakload-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

volumes:
  pg_shard0_primary_data:
  pg_shard0_replica1_data:
  pg_shard1_primary_data:
  pg_shard1_replica1_data:
  pg_shard2_primary_data:
  pg_shard2_replica1_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  peakload-network:
    driver: bridge
