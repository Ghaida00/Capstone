name: peakload

# ============================================================
# TOTAL RESOURCE BUDGET — Profile A defaults
# ------------------------------------------------------------
# Every `deploy.resources.limits` value below is env-driven
# (see .env.example sections 3.7 / 4.5 / 5 / 6.11 / 7 / 8.1).
# Numbers in this comment are the SHIPPED defaults — i.e.
# Profile A, the 2-shard / 8 GB-host configuration. Other
# profiles (B = 1-shard high-memory, C = 2-shard high-capacity,
# D = 3-shard maximum) live in .env.example §9 and override
# selected env vars only.
#
# Shard 1 and shard 2 are profile-gated. The totals below are
# the default 2-shard topology (`shard1` profile active):
#   1 shard:  COMPOSE_PROFILES=...                 (drop shard1/shard2)
#   2 shard:  COMPOSE_PROFILES=...,shard1          (DEFAULT)
#   3 shard:  COMPOSE_PROFILES=...,shard1,shard2   (+ ~3 CPU / 1 GB per shard)
#
# `db-bootstrap-schema` + `db-migrator` are one-shots (exit
# after init); not counted in steady-state — they add ~0.3 CPU
# / 160 MB for a few seconds at startup.
#
#  service                          CPU      MEM
#  ───────────────────────────────  ───────  ────────
#  nginx                            1.0      256 M
#  app          (× 2 replicas)      2.0       768 M     (1.0 CPU × 2, 384 M × 2)
#  etcd-1/2/3   (× 3)               0.45     192 M      (0.15 × 3, 64 M × 3)
#  pg-shard0-node-a/b   (× 2)       3.0      1024 M     (1.5 × 2, 512 M × 2)
#  pg-shard1-node-a/b   (× 2)*      3.0      1024 M     (* profile shard1)
#  pgbouncer-shard0/1   (× 2)       0.2      64 M       (0.1 × 2, 32 M × 2)
#  pg-haproxy                       0.15     64 M
#  redis-master                     1.0      384 M
#  redis-replica                    1.0      384 M
#  redis-sentinel-1/2/3 (× 3)       0.3      96 M       (0.1 × 3, 32 M × 3)
#  rabbitmq                         1.0      512 M
#  ───────────────────────────────  ───────  ────────
#  CORE TOTAL                       13.10    4768 M (~4.66 GB)
#
#  Observability (opt-in via COMPOSE_PROFILES):
#  prometheus                       0.5      256 M
#  grafana                          0.5      256 M
#  cadvisor                         0.2      128 M
#  otel-collector                   0.3      256 M
#  jaeger                           0.3      512 M
#  ───────────────────────────────  ───────  ────────
#  OBSERVABILITY TOTAL              1.8      1408 M (~1.37 GB)
#
#  Profile A FULL  (observability ON)   14.90    6176 M (~6.03 GB)
#  Profile A LEAN  (observability OFF)  13.10    4768 M (~4.66 GB)
#
# Other profiles (see .env.example §9 for full var lists):
#  Profile B  1-shard high-memory       ~12.0    ~5.0 GB
#  Profile C  2-shard high-capacity     ~16.0    ~7.0 GB
#  Profile D  3-shard maximum           ~20.0    ~9.0 GB
#
# Notes:
# * Limits, not requests — idle usage is well below these.
#   8 cores + 8 GB RAM is the comfortable floor for Profile A;
#   Profile B/C/D need more.
# * `app` replicas fixed at 2 (deploy.replicas) — host scaling
#   below 8 cores / 8 GB? Either stay on Profile A and drop
#   APP_CPU_LIMIT to 0.5 in .env, or switch to Profile B
#   (single shard) for the lowest-overhead layout.
# * Observability (prometheus/grafana/cadvisor/otel-collector/
#   jaeger) is gated via Compose profiles in COMPOSE_PROFILES:
#   `observability` = all; `tracing` / `metrics` = subset;
#   blank = LEAN (k6 perf runs).
# ============================================================

# ============================================================
# Shared config via YAML anchors
# ============================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# ============================================================
# Patroni anchors
# ------------------------------------------------------------
# All Postgres nodes (currently 2 shards × 2 — shard 2 is
# commented out below for resource conservation; flip it back
# on to return to the documented 3×2 topology) run the same
# custom image defined in db/patroni/Dockerfile: PostgreSQL
# 18.3 on bookworm + Patroni 4.x + python-etcd3 + envsubst.
# Patroni renders a per-node config from
# templates/patroni.yml.tmpl at container start and then IS
# the PG process manager.
#
# See docs/ha-architecture.md and db/patroni/README.md for
# the full rationale — notably why we chose Patroni over
# pg_auto_failover (to keep PG 18) and why we deferred the
# watchdog / per-scope etcd clustering.
# ============================================================
x-patroni-build: &patroni-build
  context: ./db/patroni
  dockerfile: Dockerfile

x-pg-node-common: &pg-node-common
  build: *patroni-build
  image: peakload/patroni-pg18:local
  restart: unless-stopped
  logging: *default-logging
  networks:
    - peakload-network
  # 60s start_period tolerates the first-boot sequence
  # (initdb on the first primary, pg_basebackup on the
  # replica). Patroni exits non-zero on config errors, so
  # the healthcheck plus Docker restart policy is enough to
  # surface misconfigurations.
  healthcheck:
    test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 60s

# Shared env for every Patroni node. Per-node variance
# (scope, name, hostname) is injected at the service level.
x-pg-node-env: &pg-node-env
  PGDATA: /var/lib/postgresql/data
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
  REPL_PASSWORD: ${REPL_PASSWORD:?set REPL_PASSWORD in .env}
  ETCD_HOSTS: "etcd-1:2379,etcd-2:2379,etcd-3:2379"
  # Durability posture — rendered into each node's local PG
  # parameters by patroni-entrypoint.sh. Defaults here mirror
  # the entrypoint's so a missing .env entry stays safe. See
  # the "Postgres durability posture" block in .env.
  PG_SYNCHRONOUS_COMMIT: ${PG_SYNCHRONOUS_COMMIT:-remote_write}
  PG_COMMIT_DELAY: ${PG_COMMIT_DELAY:-0}
  PG_COMMIT_SIBLINGS: ${PG_COMMIT_SIBLINGS:-5}
  # Cluster-wide max_connections — rendered into the DCS
  # parameters of patroni.yml.tmpl. Default 120 mirrors the
  # entrypoint. Pair changes with `PG_MEMORY_LIMIT` because
  # each backend slot needs ~10 MB resident.
  PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-120}
  # PG buffer pool size. Rendered into DCS-level
  # `shared_buffers`. Default 64MB matches the 512m container;
  # raise to 256MB if PG_MEMORY_LIMIT goes to 1024m. Same
  # DCS-bootstrap caveat as PG_MAX_CONNECTIONS — see .env
  # for the patronictl edit-config workflow.
  PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-64MB}

# Per-node resource envelope. 1.5 CPU / 512 MB gives the
# primary headroom for both request-driven INSERT/UPDATE
# traffic — which contends on `UPDATE … WHERE balance >= …`
# and the WAL flush — and the streaming-replication walsender.
# `shared_buffers` / `work_mem` in patroni.yml.tmpl are sized
# for 512 MB.
#
# Pairs with the `app` service capped at 2 × 1.0 CPU below
# so the total host CPU budget fits an 8-core machine.
x-pg-node-deploy: &pg-node-deploy
  resources:
    limits:
      # Rendered from PG_MEMORY_LIMIT in .env (default 512m).
      # When raising, also bump shared_buffers / effective_cache_size
      # in patroni.yml.tmpl OR raise PG_MAX_CONNECTIONS to consume
      # the headroom — otherwise the extra RAM sits unused.
      memory: ${PG_MEMORY_LIMIT:-512m}
      cpus: ${PG_CPU_LIMIT:-1.5}

# ============================================================
# etcd anchors
# ------------------------------------------------------------
# Patroni's DCS. Three-node cluster so we tolerate one loss
# without losing quorum. Upstream `quay.io/coreos/etcd` image
# (the canonical etcd-io build, also shipped inside Kubernetes)
# instead of the Bitnami image — Broadcom retired large parts
# of the free Bitnami catalogue mid-2025 and `bitnami/etcd:*`
# tags now intermittently return "manifest unknown". Upstream
# ships `etcdctl` at `/usr/local/bin/etcdctl` so the
# operational cheatsheet in db/patroni/README.md still works.
# ============================================================
x-etcd-common: &etcd-common
  image: quay.io/coreos/etcd:v3.6.5
  restart: unless-stopped
  logging: *default-logging
  networks:
    - peakload-network
  healthcheck:
    test: [ "CMD", "etcdctl", "endpoint", "health" ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  deploy:
    resources:
      limits:
        memory: ${ETCD_MEMORY_LIMIT:-64M}
        cpus: "${ETCD_CPU_LIMIT:-0.15}"

x-etcd-env-common: &etcd-env-common
  # Upstream etcd has auth disabled by default — no
  # `ALLOW_NONE_AUTHENTICATION` (Bitnami-only) needed. We run
  # this on a trusted overlay network so unauthenticated peer
  # access is acceptable for the capstone.
  ETCD_DATA_DIR: "/etcd-data"
  ETCD_INITIAL_CLUSTER: "etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380"
  ETCD_INITIAL_CLUSTER_STATE: "new"
  ETCD_INITIAL_CLUSTER_TOKEN: "peakload-etcd-cluster"
  ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
  ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:2380"

# ============================================================
# pgBouncer anchors
# ------------------------------------------------------------
# pgBouncer points at pg-haproxy. HAProxy forwards each
# shard's frontend (:5000 for shard 0, :5001 for shard 1;
# :5002 returns when shard 2 is re-enabled) to whichever
# node is currently primary, so pgBouncer's backend URL is
# stable across failovers.
# ============================================================
x-pgbouncer-common: &pgbouncer-common
  image: edoburu/pgbouncer:v1.25.1-p0
  restart: unless-stopped
  logging: *default-logging
  networks:
    - peakload-network
  expose:
    - "5432"

x-pgbouncer-env: &pgbouncer-env
  AUTH_TYPE: scram-sha-256
  POOL_MODE: transaction
  # Pool sizes are env-driven so the per-profile scaling
  # rungs in .env.example §9 work end-to-end. Defaults below
  # match Profile A (2-shard, 2 app × 40 write-pool). The full
  # connection-stack invariant is documented in .env.example
  # §3.3; raising DB_WRITE_POOL_SIZE without raising
  # PGBOUNCER_DEFAULT_POOL_SIZE causes silent client-side
  # queueing inside pgBouncer (audit D-2).
  DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-80}
  MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
  MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-200}
  MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-30}
  RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-20}
  RESERVE_POOL_TIMEOUT: 2
  # server_lifetime is deliberately short (1h) so that
  # long-lived pgBouncer→HAProxy conns get recycled, which
  # bounds the window in which a stale route could persist
  # after a promotion. `on-marked-down shutdown-sessions` in
  # haproxy.cfg handles the acute case; this is the belt-
  # and-suspenders cap.
  SERVER_IDLE_TIMEOUT: 300
  SERVER_LIFETIME: 3600
  LOG_CONNECTIONS: 0
  LOG_DISCONNECTIONS: 0

x-pgbouncer-healthcheck: &pgbouncer-healthcheck
  test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER}" ]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 10s

x-pgbouncer-deploy: &pgbouncer-deploy
  resources:
    limits:
      memory: ${PGBOUNCER_MEMORY_LIMIT:-32M}
      cpus: "${PGBOUNCER_CPU_LIMIT:-0.1}"

# ============================================================
# Redis anchors
# ============================================================
x-redis-command: &redis-command >
  redis-server
    --maxmemory 256mb
    --maxmemory-policy allkeys-lru
    --save ""
    --appendonly yes
    --appendfsync everysec
    --auto-aof-rewrite-percentage 100
    --auto-aof-rewrite-min-size 64mb
    --tcp-backlog 511
    --tcp-keepalive 300
    --hz 100
    --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    --masterauth ${REDIS_PASSWORD}

x-redis-healthcheck: &redis-healthcheck
  test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 5s

x-sentinel-common: &sentinel-common
  image: redis:8.6.1-alpine3.23
  restart: unless-stopped
  logging: *default-logging
  networks:
    - peakload-network
  volumes:
    - ./redis/sentinel.conf:/tmp/sentinel.conf:ro
  command: >
    sh -c "cp /tmp/sentinel.conf /etc/sentinel.conf &&
           chmod 644 /etc/sentinel.conf &&
           redis-sentinel /etc/sentinel.conf"
  depends_on:
    redis-master:
      condition: service_healthy
  expose:
    - "26379"
  healthcheck:
    test: [ "CMD", "redis-cli", "-p", "26379", "ping" ]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s
  deploy:
    resources:
      limits:
        memory: ${REDIS_SENTINEL_MEMORY_LIMIT:-32M}
        cpus: "${REDIS_SENTINEL_CPU_LIMIT:-0.1}"

services:
  # ============================================================
  # Nginx — Reverse Proxy & Load Balancer
  # ============================================================
  nginx:
    image: nginx:1.29.6-alpine3.23-slim
    container_name: peakload-nginx
    ports:
      - "8080:80"
    volumes:
      # OPS-2 / S-5: rendered by the official image's envsubst step
      # (20-envsubst-on-templates.sh) at container start.
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      # Edge rate-limit knobs. Default = production-safe ceiling.
      # Benchmarks restore bench throughput by exporting the high
      # values before `docker compose up` (e.g. in .env or shell):
      #   NGINX_PER_IP_RATE=50000 NGINX_GLOBAL_RATE=100000 \
      #   NGINX_PER_IP_BURST=10000 NGINX_GLOBAL_BURST=50000
      NGINX_PER_IP_RATE: "${NGINX_PER_IP_RATE:-2000}"
      NGINX_GLOBAL_RATE: "${NGINX_GLOBAL_RATE:-50000}"
      NGINX_PER_IP_BURST: "${NGINX_PER_IP_BURST:-2000}"
      NGINX_GLOBAL_BURST: "${NGINX_GLOBAL_BURST:-10000}"
      # Render the full main config (not a conf.d snippet) to
      # /etc/nginx/nginx.conf.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT:-256M}
          cpus: "${NGINX_CPU_LIMIT:-1.0}"

  # ============================================================
  # Rust Application — 2 replicas
  # ------------------------------------------------------------
  # depends_on `db-bootstrap-schema: service_completed_successfully`
  # guarantees that init.sql has been applied to every shard
  # primary before the app tries to query. The bootstrap job
  # is idempotent so restarts don't trigger re-runs on a
  # populated database.
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Hardening — distroless+nonroot already runs as UID 65532; this layer
    # adds defence-in-depth: no writable rootfs, no kernel caps, no privilege
    # escalation, fork-bomb cap. App code does no filesystem writes (verified
    # via grep for std::fs / tokio::fs::write|create), so read_only is safe.
    # /tmp tmpfs is provided in case any dep (rustls cert cache, etc.) writes.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      # ── Failover wiring ─────────────────────────────────────────
      # Sentinel-aware Redis client.
      REDIS_SENTINEL_NODES: "redis://redis-sentinel-1:26379,redis://redis-sentinel-2:26379,redis://redis-sentinel-3:26379"
      REDIS_SENTINEL_MASTER_NAME: "peakload-master"
      REDIS_SENTINEL_MONITOR_INTERVAL_SECS: "5"
      # Per-replica health probe interval for Postgres reads.
      DB_HEALTH_CHECK_INTERVAL_SECS: "5"
      # Retry policy — must cover the Patroni promotion window
      # (typically 5–15s, bounded by the etcd leader-lease TTL).
      # Defaults in src/config.rs are tuned for this; override
      # here only for experimentation.
      DB_WRITE_RETRY_MAX_ATTEMPTS: "6"
      DB_WRITE_RETRY_BACKOFF_MS: "200"
      # ── S-1 / S-2: JWT validator config ──────────────────
      # Required when ENABLE_AUTH=true (validate() fails closed
      # at boot if missing); ignored when auth is off.
      AUTH_EXPECTED_ISSUER: "${AUTH_EXPECTED_ISSUER:-}"
      AUTH_EXPECTED_AUDIENCE: "${AUTH_EXPECTED_AUDIENCE:-}"
      AUTH_LEEWAY_SECS: "${AUTH_LEEWAY_SECS:-30}"
      # ── R-9: degradation posture seed ────────────────────
      # Safe default = normal. Flip a maintenance window by
      # exporting DEGRADATION_MODE=read_only before `up`, or
      # (preferred, no restart) PUT /api/v2/admin/degradation.
      DEGRADATION_MODE: "${DEGRADATION_MODE:-normal}"
      # ── OpenTelemetry ────────────────────────────────────
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: "peakload-capstone"
    expose:
      - "3000"
    depends_on:
      pgbouncer-shard0:
        condition: service_healthy
      # Shards 1 and 2 are profile-gated (see "SHARD 1" / "SHARD 2"
      # blocks below). `required: false` makes the dependency
      # non-fatal when the corresponding profile is not active —
      # `docker compose up` without `shard1` in COMPOSE_PROFILES
      # still boots the app, in single-shard mode.
      pgbouncer-shard1:
        condition: service_healthy
        required: false
      pgbouncer-shard2:
        condition: service_healthy
        required: false
      db-bootstrap-schema:
        condition: service_completed_successfully
      db-migrator:
        condition: service_completed_successfully
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
        required: false
    healthcheck:
      test: [ "CMD", "/app/peakload-capstone", "--health-check" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      # 2 replicas × 1.0 CPU on an 8-core host. Higher counts
      # oversubscribe the scheduler (every container competes
      # for cores → context-switch storms inflate p95 / p99),
      # and capping at 2 frees CPU for PG to run at 1.5 per
      # node (see x-pg-node-deploy).
      #
      # HA tradeoff: a single crash leaves one survivor. Bump
      # to 4 if the broader fault-tolerance story matters more
      # than the latency tail.
      replicas: 2
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-384M}
          cpus: "${APP_CPU_LIMIT:-1.0}"
          pids: 256

  # ============================================================
  # etcd cluster — Patroni's distributed config store
  # ------------------------------------------------------------
  # Three nodes so we tolerate one loss without losing quorum.
  # Patroni talks to this cluster for leader election, cluster
  # configuration, and member state. A majority MUST be alive
  # for primaries to stay writable; if quorum is lost, Patroni
  # demotes all primaries to read-only to prevent split-brain.
  #
  # No external port exposure — etcd is only reached from
  # inside the peakload network.
  # ============================================================
  etcd-1:
    <<: *etcd-common
    container_name: peakload-etcd-1
    environment:
      <<: *etcd-env-common
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd-1:2379"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://etcd-1:2380"
    volumes:
      - etcd_1_data:/etcd-data

  etcd-2:
    <<: *etcd-common
    container_name: peakload-etcd-2
    environment:
      <<: *etcd-env-common
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd-2:2379"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://etcd-2:2380"
    volumes:
      - etcd_2_data:/etcd-data

  etcd-3:
    <<: *etcd-common
    container_name: peakload-etcd-3
    environment:
      <<: *etcd-env-common
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd-3:2379"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://etcd-3:2380"
    volumes:
      - etcd_3_data:/etcd-data

  # ============================================================
  # SHARD 0 — two Patroni-managed nodes
  # ------------------------------------------------------------
  # Patroni + etcd assign primary/replica roles dynamically.
  # On first boot, whichever node wins the etcd leader lock
  # for scope `peakload-shard0` becomes primary; the other
  # joins as a streaming replica and catches up via
  # pg_basebackup. After a promotion they flip roles.
  # Do NOT assume node-a is always the primary.
  # ============================================================
  pg-shard0-node-a:
    <<: *pg-node-common
    container_name: peakload-pg-shard0-node-a
    environment:
      <<: *pg-node-env
      PATRONI_SCOPE:    peakload-shard0
      PATRONI_NAME:     shard0-a
      PATRONI_HOSTNAME: pg-shard0-node-a
    volumes:
      # Mount at the parent path (postgres image declares
      # `VOLUME /var/lib/postgresql`). Mounting only PGDATA
      # would leave the parent uncovered and Docker would
      # spawn a fresh anonymous volume for it on every
      # container recreate. PGDATA stays at the `data/`
      # subdirectory inside this named volume (see patroni-
      # entrypoint.sh which chowns both).
      - pg_shard0_node_a_data:/var/lib/postgresql
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    deploy: *pg-node-deploy

  pg-shard0-node-b:
    <<: *pg-node-common
    container_name: peakload-pg-shard0-node-b
    environment:
      <<: *pg-node-env
      PATRONI_SCOPE:    peakload-shard0
      PATRONI_NAME:     shard0-b
      PATRONI_HOSTNAME: pg-shard0-node-b
    volumes:
      # Mounted at parent path — see pg-shard0-node-a for rationale.
      - pg_shard0_node_b_data:/var/lib/postgresql
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
      # Slight stagger so node-a wins the etcd leader-lock
      # race on a cold boot. Not a correctness requirement
      # — Patroni converges either way — just a tidier
      # first-time log.
      pg-shard0-node-a:
        condition: service_started
    deploy: *pg-node-deploy

  pgbouncer-shard0:
    <<: *pgbouncer-common
    container_name: peakload-pgbouncer-shard0
    environment:
      <<: *pgbouncer-env
      # Backend → HAProxy :5000 → whichever node is primary.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg-haproxy:5000/${POSTGRES_DB}
    depends_on:
      pg-haproxy:
        condition: service_healthy
    healthcheck: *pgbouncer-healthcheck
    deploy: *pgbouncer-deploy

  # ============================================================
  # SHARD 1 — two Patroni-managed nodes (scope peakload-shard1)
  # ============================================================
  # SHARD 1 — profile-gated. The 3 services below activate only
  # when `shard1` is in COMPOSE_PROFILES (see .env). Without the
  # profile, the app boots in single-shard mode and `app` /
  # `pg-haproxy` skip their `pgbouncer-shard1` / `pg-shard1-*`
  # dependencies via `required: false`.
  pg-shard1-node-a:
    <<: *pg-node-common
    container_name: peakload-pg-shard1-node-a
    profiles: ["shard1"]
    environment:
      <<: *pg-node-env
      PATRONI_SCOPE:    peakload-shard1
      PATRONI_NAME:     shard1-a
      PATRONI_HOSTNAME: pg-shard1-node-a
    volumes:
      # Mounted at parent path — see pg-shard0-node-a for rationale.
      - pg_shard1_node_a_data:/var/lib/postgresql
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    deploy: *pg-node-deploy

  pg-shard1-node-b:
    <<: *pg-node-common
    container_name: peakload-pg-shard1-node-b
    profiles: ["shard1"]
    environment:
      <<: *pg-node-env
      PATRONI_SCOPE:    peakload-shard1
      PATRONI_NAME:     shard1-b
      PATRONI_HOSTNAME: pg-shard1-node-b
    volumes:
      # Mounted at parent path — see pg-shard0-node-a for rationale.
      - pg_shard1_node_b_data:/var/lib/postgresql
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
      pg-shard1-node-a:
        condition: service_started
    deploy: *pg-node-deploy

  pgbouncer-shard1:
    <<: *pgbouncer-common
    container_name: peakload-pgbouncer-shard1
    profiles: ["shard1"]
    environment:
      <<: *pgbouncer-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg-haproxy:5001/${POSTGRES_DB}
    depends_on:
      pg-haproxy:
        condition: service_healthy
    healthcheck: *pgbouncer-healthcheck
    deploy: *pgbouncer-deploy

  # ============================================================
  # SHARD 2 — profile-gated (resource-conservation by default)
  # ------------------------------------------------------------
  # Activates only when `shard2` is in COMPOSE_PROFILES. The Rust
  # shard router enforces a contiguity rule (shard 2 requires
  # shard 1), so enabling shard 2 means setting:
  #     COMPOSE_PROFILES=...,shard1,shard2
  # plus the matching DATABASE_SHARD1_* + DATABASE_SHARD2_* env
  # vars. `Config::validate` rejects half-set toggles at boot.
  # ============================================================
  pg-shard2-node-a:
    <<: *pg-node-common
    container_name: peakload-pg-shard2-node-a
    profiles: ["shard2"]
    environment:
      <<: *pg-node-env
      PATRONI_SCOPE:    peakload-shard2
      PATRONI_NAME:     shard2-a
      PATRONI_HOSTNAME: pg-shard2-node-a
    volumes:
      # Mounted at parent path — see pg-shard0-node-a for rationale.
      - pg_shard2_node_a_data:/var/lib/postgresql
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    deploy: *pg-node-deploy

  pg-shard2-node-b:
    <<: *pg-node-common
    container_name: peakload-pg-shard2-node-b
    profiles: ["shard2"]
    environment:
      <<: *pg-node-env
      PATRONI_SCOPE:    peakload-shard2
      PATRONI_NAME:     shard2-b
      PATRONI_HOSTNAME: pg-shard2-node-b
    volumes:
      # Mounted at parent path — see pg-shard0-node-a for rationale.
      - pg_shard2_node_b_data:/var/lib/postgresql
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
      pg-shard2-node-a:
        condition: service_started
    deploy: *pg-node-deploy

  pgbouncer-shard2:
    <<: *pgbouncer-common
    container_name: peakload-pgbouncer-shard2
    profiles: ["shard2"]
    environment:
      <<: *pgbouncer-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg-haproxy:5002/${POSTGRES_DB}
    depends_on:
      pg-haproxy:
        condition: service_healthy
    healthcheck: *pgbouncer-healthcheck
    deploy: *pgbouncer-deploy

  # ============================================================
  # pg-haproxy — role-aware write router
  # ------------------------------------------------------------
  # One HAProxy with three TCP frontends, one per shard. Each
  # backend's health check hits the socat sidecar on port
  # 8008 of both shard nodes and forwards writes to whichever
  # answers HTTP 200 on GET /primary. See haproxy/README.md
  # for the detailed protocol.
  #
  # The stats dashboard (container port 7000) is published to
  # 127.0.0.1 only — reachable from the host for debugging but
  # never from the public internet. See the ports: block below.
  # ============================================================
  pg-haproxy:
    image: haproxy:3.3-alpine
    container_name: peakload-pg-haproxy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # Host port left unspecified: Docker binds a free ephemeral port
      # on 127.0.0.1 at `up` time. A fixed host port is unsafe on
      # Windows — WinNAT reserves arbitrary blocks from the TCP dynamic
      # range, and binding inside a reserved block fails with WSAEACCES.
      # Letting the OS choose avoids every reservation. Discover the
      # assigned URL with:  docker compose port pg-haproxy 7000
      - "127.0.0.1::7000"
    expose:
      - "5000"
      - "5001"
      - "5002"
    depends_on:
      pg-shard0-node-a:
        condition: service_healthy
      pg-shard0-node-b:
        condition: service_healthy
      # Shards 1 and 2 are profile-gated. `required: false` means
      # HAProxy boots even when those profiles are inactive — the
      # corresponding backends simply stay DOWN (their health probe
      # has no target), which is harmless because nothing routes
      # to them in single-shard mode.
      pg-shard1-node-a:
        condition: service_healthy
        required: false
      pg-shard1-node-b:
        condition: service_healthy
        required: false
      pg-shard2-node-a:
        condition: service_healthy
        required: false
      pg-shard2-node-b:
        condition: service_healthy
        required: false
    healthcheck:
      # Stats page on :7000 is served unconditionally once
      # HAProxy is up, so this is a cheap liveness probe.
      # Backend UP/DOWN state is observable there for humans
      # but we don't assert it in Docker — pgBouncer retries
      # cover the transient-no-backend window.
      test: [ "CMD-SHELL", "wget -q -O- http://127.0.0.1:7000/ >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${PG_HAPROXY_MEMORY_LIMIT:-64M}
          cpus: "${PG_HAPROXY_CPU_LIMIT:-0.15}"

  # ============================================================
  # db-bootstrap-schema — one-shot init.sql applier
  # ------------------------------------------------------------
  # Patroni runs PG under its own entrypoint and bypasses the
  # standard /docker-entrypoint-initdb.d mechanism, so init.sql
  # never auto-runs. This container uses the stock postgres
  # image (for `psql`), waits for each shard primary to be up
  # via pg-haproxy, and applies init.sql iff the canary table
  # is missing. Idempotent; safe to re-run.
  #
  # The script it mounts (db/bootstrap/bootstrap-schema.sh) is
  # intentionally HA-agnostic — it talks only to pg-haproxy,
  # so it survived the move from pg_auto_failover to Patroni
  # with only a header edit.
  #
  # restart: "no" + condition: service_completed_successfully
  # on the `app` service gates app start on schema readiness.
  # ============================================================
  db-bootstrap-schema:
    image: postgres:18.3-alpine3.23
    container_name: peakload-db-bootstrap-schema
    entrypoint: [ "/bin/sh", "/opt/bootstrap-schema.sh" ]
    # The postgres image declares `VOLUME /var/lib/postgresql`,
    # which otherwise spawns a fresh anonymous volume on every
    # container recreate. This container only runs psql against
    # remote pg-haproxy and never touches its own /var/lib/postgresql,
    # so an 8 MB tmpfs there is sufficient to satisfy the VOLUME
    # declaration without leaving disk residue.
    tmpfs:
      - /var/lib/postgresql:size=8m
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB:       ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PG_HAPROXY_HOST:   pg-haproxy
      # Space-separated shard primary ports — set via env so the
      # bootstrap container processes only the shards activated in
      # COMPOSE_PROFILES. Default is the 2-shard topology; override
      # in .env to "5000" (single-shard) or "5000 5001 5002" (3-shard).
      PG_HAPROXY_PORTS:  "${PG_HAPROXY_PORTS:-5000 5001}"
      # D-1/R-3: server-side statement/lock/idle-in-tx timeouts (milliseconds), applied per shard primary as ALTER DATABASE defaults by bootstrap-schema.sh.
      DB_STATEMENT_TIMEOUT_MS:   "2000"
      DB_LOCK_TIMEOUT_MS:        "500"
      DB_IDLE_IN_TX_TIMEOUT_MS:  "5000"
    volumes:
      - ./db/bootstrap/bootstrap-schema.sh:/opt/bootstrap-schema.sh:ro
      - ./db/init.sql:/sql/init.sql:ro
    depends_on:
      pg-haproxy:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${DB_BOOTSTRAP_MEMORY_LIMIT:-64M}
          cpus: "${DB_BOOTSTRAP_CPU_LIMIT:-0.1}"

  # ============================================================
  # DB migrator — one-shot sqlx::migrate! runner (D-7)
  # ============================================================
  # Runs the existing app image with `--migrate`, which connects
  # directly to each shard primary via HAProxy (NOT pgBouncer —
  # pgBouncer's transaction-pool mode rejects the startup options
  # the connection-level lock_timeout/statement_timeout overrides
  # would need; and the bypass also avoids racing the two app
  # instances over the ACCESS EXCLUSIVE lock). Migrations are
  # idempotent (`IF NOT EXISTS` everywhere); re-runs are no-ops
  # recorded in `_sqlx_migrations`.
  #
  # Gated on `db-bootstrap-schema` (the baseline init.sql must
  # exist first) and on `pg-haproxy: service_healthy` so the
  # primary route is up. The app's `depends_on` waits on this
  # service `service_completed_successfully` so the app cannot
  # boot against an un-migrated schema.
  # ============================================================
  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: peakload-app
    container_name: peakload-db-migrator
    command: ["/app/peakload-capstone", "--migrate"]
    environment:
      # CSV of direct-to-primary URLs via HAProxy ports
      # (5000=shard0, 5001=shard1, 5002=shard2). The migrator
      # filters empty CSV entries, so trailing commas are safe.
      # Default targets the 2-shard topology; override in .env when
      # toggling shard 1 off (single-shard) or shard 2 on (3 shards).
      # Note: Compose's .env files do NOT recursively interpolate
      # `${VAR}` references — an override there must hard-code the
      # username/password. See .env.example for copy-paste examples.
      MIGRATE_SHARD_URLS: "${MIGRATE_SHARD_URLS:-postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@pg-haproxy:5000/${POSTGRES_DB:?},postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@pg-haproxy:5001/${POSTGRES_DB:?}}"
      # The migrator only needs sqlx + dotenv; suppress noisy app-startup
      # env to keep the log output focused on migration progress.
      RUST_LOG: "info,sqlx::query=warn"
    depends_on:
      pg-haproxy:
        condition: service_healthy
      db-bootstrap-schema:
        condition: service_completed_successfully
    restart: "no"
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${DB_MIGRATOR_MEMORY_LIMIT:-96M}
          cpus: "${DB_MIGRATOR_CPU_LIMIT:-0.2}"

  # ============================================================
  # Redis HA — Master + Replica + Sentinel
  # ============================================================
  redis-master:
    image: redis:8.6.1-alpine3.23
    container_name: peakload-redis-master
    command: *redis-command
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck: *redis-healthcheck
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${REDIS_MASTER_MEMORY_LIMIT:-384M}
          cpus: "${REDIS_MASTER_CPU_LIMIT:-1.0}"

  redis-replica:
    image: redis:8.6.1-alpine3.23
    container_name: peakload-redis-replica
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly yes
        --appendfsync everysec
        --auto-aof-rewrite-percentage 100
        --auto-aof-rewrite-min-size 64mb
        --tcp-backlog 511
        --tcp-keepalive 300
        --hz 100
        --requirepass ${REDIS_PASSWORD}
        --masterauth ${REDIS_PASSWORD}
        --replicaof redis-master 6379
    expose:
      - "6379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck: *redis-healthcheck
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${REDIS_REPLICA_MEMORY_LIMIT:-384M}
          cpus: "${REDIS_REPLICA_CPU_LIMIT:-1.0}"

  redis-sentinel-1:
    <<: *sentinel-common
    container_name: peakload-redis-sentinel-1

  redis-sentinel-2:
    <<: *sentinel-common
    container_name: peakload-redis-sentinel-2

  redis-sentinel-3:
    <<: *sentinel-common
    container_name: peakload-redis-sentinel-3

  # ============================================================
  # RabbitMQ — Async Message Queue
  # ============================================================
  rabbitmq:
    image: rabbitmq:4.2.4-alpine
    container_name: peakload-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: /
    expose:
      - "5672"
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:-512M}
          cpus: "${RABBITMQ_CPU_LIMIT:-1.0}"

  # ============================================================
  # Prometheus — Metrics Collection
  # ============================================================
  # NOTE: No healthcheck is defined on purpose.
  #
  # The `*-distroless` image ships ONLY the `prometheus` binary — no
  # shell, no `wget`, no `curl`, no `busybox`. Any healthcheck that
  # shells out (e.g. `wget http://localhost:9090/-/healthy`) will exec-
  # fail every probe → container stuck `(unhealthy)` → every service
  # with `depends_on: prometheus: condition: service_healthy` (notably
  # Grafana) will refuse to start with:
  #     "dependency prometheus failed to start"
  #
  # Do NOT re-add a wget/curl healthcheck unless you also drop the
  # `-distroless` suffix from the image tag. If you need dependency
  # ordering for Grafana, use `condition: service_started` (already
  # set on the Grafana service below) — Prometheus start-up is
  # deterministic and does not need a readiness gate here.
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.10.0-distroless
    container_name: peakload-prometheus
    profiles: ["observability", "metrics", "prometheus"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT:-256M}
          cpus: "${PROMETHEUS_CPU_LIMIT:-0.5}"

  # ============================================================
  # OpenTelemetry Collector — receives OTLP traces from app
  # ============================================================
  # Receives OTLP/gRPC on 4317 and fans traces out to two exporters:
  # `debug` (span-count heartbeat in `docker logs
  # peakload-otel-collector`) and `otlp` (forwards to the `jaeger`
  # service for the searchable trace UI). See otel/collector.yaml.
  # No healthcheck (image is upstream-distroless: no shell). App
  # depends on `service_started`, mirroring the prometheus pattern.
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: peakload-otel-collector
    profiles: ["observability", "tracing", "otel-collector"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    expose:
      - "4317"
    # Start after Jaeger so the `otlp` exporter's first spans have a
    # back-end to land in (the exporter retries regardless, but this
    # keeps the cold-start window clean).
    depends_on:
      jaeger:
        condition: service_started
        required: false
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${OTEL_COLLECTOR_MEMORY_LIMIT:-256M}
          cpus: "${OTEL_COLLECTOR_CPU_LIMIT:-0.3}"

  # ============================================================
  # Jaeger — trace UI + storage back-end for the collector
  # ============================================================
  # All-in-one Jaeger: receives OTLP/gRPC on 4317 from the
  # otel-collector's `otlp` exporter, stores spans in memory
  # (MEMORY_MAX_TRACES bounds RAM under load-test span volume), and
  # serves the search/trace UI on :16686 → host :16686. In-memory
  # storage is intentional — traces here are a live debugging
  # surface, not a retained record; a restart clears them.
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: peakload-jaeger
    profiles: ["observability", "tracing", "jaeger"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "50000"
    ports:
      - "16686:16686"
    expose:
      - "4317"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${JAEGER_MEMORY_LIMIT:-512M}
          cpus: "${JAEGER_CPU_LIMIT:-0.3}"

  # ============================================================
  # Grafana — Metrics Visualization
  # ============================================================
  grafana:
    image: grafana/grafana:12.3
    container_name: peakload-grafana
    profiles: ["observability", "metrics", "grafana"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?set GRAFANA_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Grafana waits for Prometheus to START, not to be HEALTHY, because
    # the Prometheus service has no healthcheck (see comment above the
    # prometheus service for why). Prometheus start-up is deterministic
    # enough that this is safe — Grafana's own datasource provisioning
    # tolerates a Prometheus that isn't answering scrapes yet.
    depends_on:
      prometheus:
        condition: service_started
        required: false
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-256M}
          cpus: "${GRAFANA_CPU_LIMIT:-0.5}"

  # ============================================================
  # cAdvisor — Per-Container Resource Monitoring
  # ============================================================
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: peakload-cadvisor
    profiles: ["observability", "metrics", "cadvisor"]
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: ${CADVISOR_MEMORY_LIMIT:-128M}
          cpus: "${CADVISOR_CPU_LIMIT:-0.2}"

# ============================================================
# Volumes
# ------------------------------------------------------------
# One volume per Patroni node (not per role, because roles
# flip on failover) and one per etcd member. Nothing is
# shared across containers — all persistence is per-service.
# ============================================================
volumes:
  etcd_1_data:
  etcd_2_data:
  etcd_3_data:
  pg_shard0_node_a_data:
  pg_shard0_node_b_data:
  pg_shard1_node_a_data:
  pg_shard1_node_b_data:
  # Shard 2 — declared unconditionally so the (profile-gated)
  # pg-shard2-node-{a,b} services can reference them. Docker
  # only materializes a named volume on first use; declaring
  # it without an active service is harmless.
  pg_shard2_node_a_data:
  pg_shard2_node_b_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  peakload-network:
    driver: bridge
