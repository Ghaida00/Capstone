name: peakload

services:
  # ============================================================
  # Nginx — Reverse Proxy & Load Balancer
  # ============================================================
  nginx:
    image: nginx:1.29.6-alpine3.23-slim
    container_name: peakload-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ============================================================
  # Rust Application — 2 replicas
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    expose:
      - "3000"
    depends_on:
      pgbouncer-shard0:
        condition: service_healthy
      pgbouncer-shard1:
        condition: service_healthy
      pgbouncer-shard2:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/app/peakload-capstone", "--health-check" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ============================================================
  # SHARD 0 — PostgreSQL Primary + 1 Replica + pgBouncer
  # ============================================================
  pg-shard0-primary:
    image: postgres:18.3-alpine3.23
    container_name: peakload-pg-shard0-primary
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peakload_db}
      POSTGRES_USER: ${POSTGRES_USER:-peakload_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peakload_secure_pass}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      REPL_PASSWORD: ${REPL_PASSWORD:-repl_secure_pass}
    volumes:
      - pg_shard0_primary_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/primary-setup.sh:/docker-entrypoint-initdb.d/02-primary-setup.sh:ro
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=10
        -c max_replication_slots=10
        -c hot_standby=on
        -c shared_buffers=64MB
        -c effective_cache_size=192MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=300
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peakload_user} -d ${POSTGRES_DB:-peakload_db}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  pg-shard0-replica1:
    image: postgres:18.3-alpine3.23
    container_name: peakload-pg-shard0-replica1
    environment:
      PGUSER: ${POSTGRES_USER:-peakload_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-peakload_secure_pass}
      PRIMARY_HOST: pg-shard0-primary
      REPL_PASSWORD: ${REPL_PASSWORD:-repl_secure_pass}
    volumes:
      - pg_shard0_replica1_data:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: [ "/bin/sh", "/replica-entrypoint.sh" ]
    depends_on:
      pg-shard0-primary:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peakload_user} -d ${POSTGRES_DB:-peakload_db}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  pgbouncer-shard0:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: peakload-pgbouncer-shard0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-peakload_user}:${POSTGRES_PASSWORD:-peakload_secure_pass}@pg-shard0-primary:5432/${POSTGRES_DB:-peakload_db}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 40
      MAX_CLIENT_CONN: 500
      MAX_DB_CONNECTIONS: 100
      MIN_POOL_SIZE: 15
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 300
      SERVER_LIFETIME: 3600
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    expose:
      - "5432"
    depends_on:
      pg-shard0-primary:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-peakload_user}" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"

  # ============================================================
  # SHARD 1 — PostgreSQL Primary + 1 Replica + pgBouncer
  # ============================================================
  pg-shard1-primary:
    image: postgres:18.3-alpine3.23
    container_name: peakload-pg-shard1-primary
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peakload_db}
      POSTGRES_USER: ${POSTGRES_USER:-peakload_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peakload_secure_pass}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      REPL_PASSWORD: ${REPL_PASSWORD:-repl_secure_pass}
    volumes:
      - pg_shard1_primary_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/primary-setup.sh:/docker-entrypoint-initdb.d/02-primary-setup.sh:ro
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=10
        -c max_replication_slots=10
        -c hot_standby=on
        -c shared_buffers=64MB
        -c effective_cache_size=192MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=300
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peakload_user} -d ${POSTGRES_DB:-peakload_db}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  pg-shard1-replica1:
    image: postgres:18.3-alpine3.23
    container_name: peakload-pg-shard1-replica1
    environment:
      PGUSER: ${POSTGRES_USER:-peakload_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-peakload_secure_pass}
      PRIMARY_HOST: pg-shard1-primary
      REPL_PASSWORD: ${REPL_PASSWORD:-repl_secure_pass}
    volumes:
      - pg_shard1_replica1_data:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: [ "/bin/sh", "/replica-entrypoint.sh" ]
    depends_on:
      pg-shard1-primary:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peakload_user} -d ${POSTGRES_DB:-peakload_db}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  pgbouncer-shard1:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: peakload-pgbouncer-shard1
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-peakload_user}:${POSTGRES_PASSWORD:-peakload_secure_pass}@pg-shard1-primary:5432/${POSTGRES_DB:-peakload_db}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 40
      MAX_CLIENT_CONN: 500
      MAX_DB_CONNECTIONS: 100
      MIN_POOL_SIZE: 15
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 300
      SERVER_LIFETIME: 3600
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    expose:
      - "5432"
    depends_on:
      pg-shard1-primary:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-peakload_user}" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"

  # ============================================================
  # SHARD 2 — PostgreSQL Primary + 1 Replica + pgBouncer
  # ============================================================
  pg-shard2-primary:
    image: postgres:18.3-alpine3.23
    container_name: peakload-pg-shard2-primary
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peakload_db}
      POSTGRES_USER: ${POSTGRES_USER:-peakload_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peakload_secure_pass}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      REPL_PASSWORD: ${REPL_PASSWORD:-repl_secure_pass}
    volumes:
      - pg_shard2_primary_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/primary-setup.sh:/docker-entrypoint-initdb.d/02-primary-setup.sh:ro
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=10
        -c max_replication_slots=10
        -c hot_standby=on
        -c shared_buffers=64MB
        -c effective_cache_size=192MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=300
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peakload_user} -d ${POSTGRES_DB:-peakload_db}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  pg-shard2-replica1:
    image: postgres:18.3-alpine3.23
    container_name: peakload-pg-shard2-replica1
    environment:
      PGUSER: ${POSTGRES_USER:-peakload_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-peakload_secure_pass}
      PRIMARY_HOST: pg-shard2-primary
      REPL_PASSWORD: ${REPL_PASSWORD:-repl_secure_pass}
    volumes:
      - pg_shard2_replica1_data:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: [ "/bin/sh", "/replica-entrypoint.sh" ]
    depends_on:
      pg-shard2-primary:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peakload_user} -d ${POSTGRES_DB:-peakload_db}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  pgbouncer-shard2:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: peakload-pgbouncer-shard2
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-peakload_user}:${POSTGRES_PASSWORD:-peakload_secure_pass}@pg-shard2-primary:5432/${POSTGRES_DB:-peakload_db}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 40
      MAX_CLIENT_CONN: 500
      MAX_DB_CONNECTIONS: 100
      MIN_POOL_SIZE: 15
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 300
      SERVER_LIFETIME: 3600
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    expose:
      - "5432"
    depends_on:
      pg-shard2-primary:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-peakload_user}" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"

  # ============================================================
  # Redis HA — Master + Replica + Sentinel
  # ============================================================
  redis-master:
    image: redis:8.6.1-alpine3.23
    container_name: peakload-redis-master
    command: >
      redis-server
        --maxmemory 96mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --tcp-backlog 511
        --tcp-keepalive 300
        --hz 100
        --requirepass ${REDIS_PASSWORD:-peakload_redis_pass}
        --masterauth ${REDIS_PASSWORD:-peakload_redis_pass}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-peakload_redis_pass}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  redis-replica:
    image: redis:8.6.1-alpine3.23
    container_name: peakload-redis-replica
    command: >
      redis-server
        --maxmemory 96mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --tcp-backlog 511
        --tcp-keepalive 300
        --hz 100
        --requirepass ${REDIS_PASSWORD:-peakload_redis_pass}
        --masterauth ${REDIS_PASSWORD:-peakload_redis_pass}
        --replicaof redis-master 6379
    expose:
      - "6379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-peakload_redis_pass}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  redis-sentinel-1:
    image: redis:8.6.1-alpine3.23
    container_name: peakload-redis-sentinel-1
    command: >
      sh -c "cp /tmp/sentinel.conf /etc/sentinel.conf &&
             chmod 644 /etc/sentinel.conf &&
             redis-sentinel /etc/sentinel.conf"
    volumes:
      - ./redis/sentinel.conf:/tmp/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
    expose:
      - "26379"
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"

  redis-sentinel-2:
    image: redis:8.6.1-alpine3.23
    container_name: peakload-redis-sentinel-2
    command: >
      sh -c "cp /tmp/sentinel.conf /etc/sentinel.conf &&
             chmod 644 /etc/sentinel.conf &&
             redis-sentinel /etc/sentinel.conf"
    volumes:
      - ./redis/sentinel.conf:/tmp/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
    expose:
      - "26379"
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"

  redis-sentinel-3:
    image: redis:8.6.1-alpine3.23
    container_name: peakload-redis-sentinel-3
    command: >
      sh -c "cp /tmp/sentinel.conf /etc/sentinel.conf &&
             chmod 644 /etc/sentinel.conf &&
             redis-sentinel /etc/sentinel.conf"
    volumes:
      - ./redis/sentinel.conf:/tmp/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
    expose:
      - "26379"
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"

  # ============================================================
  # RabbitMQ — Async Message Queue
  # ============================================================
  rabbitmq:
    image: rabbitmq:4.2.4-alpine
    container_name: peakload-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-peakload_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-peakload_secure_pass}
      RABBITMQ_DEFAULT_VHOST: /
    expose:
      - "5672"
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ============================================================
  # Prometheus — Metrics Collection
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.10.0-distroless
    container_name: peakload-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ============================================================
  # Grafana — Metrics Visualization
  # ============================================================
  grafana:
    image: grafana/grafana:12.3
    container_name: peakload-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ============================================================
  # cAdvisor — Per-Container Resource Monitoring
  # Fix #23: Use specific device access instead of privileged mode
  # ============================================================
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: peakload-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - peakload-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

volumes:
  pg_shard0_primary_data:
  pg_shard0_replica1_data:
  pg_shard1_primary_data:
  pg_shard1_replica1_data:
  pg_shard2_primary_data:
  pg_shard2_replica1_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:


networks:
  peakload-network:
    driver: bridge
