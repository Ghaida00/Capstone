[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/shared_kernel",
    "crates/accounts",
    "crates/transactions",
    "crates/notifications",
]

# Centralised dep versions so every crate stays in lockstep. Each
# crate declares `<dep>.workspace = true` instead of repeating
# version strings; bumping a version is a one-line change here.
[workspace.dependencies]
# ── Web framework + async runtime ──
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "compression-gzip", "trace", "timeout"] }
tokio-util = { version = "0.7.18", features = ["rt"] }

# ── Database ──
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "bigdecimal", "rust_decimal"] }
bigdecimal = { version = "0.4.10", features = ["serde"] }
rust_decimal = { version = "1.37", features = ["serde-with-str", "maths"] }

# ── Cache ──
redis = { version = "1.0.5", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.23"
moka = { version = "0.12", features = ["future"] }

# ── Message queue ──
amqprs = { version = "2.1.3", features = ["urispec", "traces"] }
async-trait = "0.1.89"

# ── Serialization ──
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# ── Utilities ──
uuid = { version = "1.22.0", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4.44", features = ["serde"] }
fnv = "1.0.7"
sha2 = "0.10"
url = "2.5"
dotenvy = "0.15.7"
futures = "0.3"

# ── Auth ──
jsonwebtoken = "9.3.1"
once_cell = "1.20.2"

# ── Logging / tracing ──
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

# ── OpenTelemetry ──
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.32.1"

# ── Prometheus ──
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"

# ── Error handling ──
thiserror = "2.0.18"
anyhow = "1.0.102"

# ── Allocator ──
mimalloc = { version = "0.1.48", features = ["v3"], default-features = false }

# ── Dev / tests ──
proptest = "1.10.0"
axum-test = "19.1.1"
testcontainers = "0.27.1"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A-5: panic = "unwind" (the Rust default, made explicit). Task
# panics surface as `JoinError::is_panic()` instead of aborting
# the process — the consumer's existing JoinError requeue branch
# at consumer.rs (process_shard_batch) is now LIVE code rather
# than dead-under-abort. A panicking spawned task kills only
# that task; the orchestrator keeps serving.
panic = "unwind"
# A-5: line-tables-only carries function names + line numbers
# in backtraces at ~5% binary-size cost. A coredump or
# JoinError::is_panic() reaches operators with named frames
# instead of bare addresses. For image-size-sensitive builds
# use `--profile release-stripped` below.
debug = "line-tables-only"
strip = "none"

# A-5: image-size-optimised variant — same codegen as release,
# but strips symbols. Use for the runtime container layer when
# binary size is the constraint; use `release` (above) for any
# build where backtrace quality matters (single-tenant on-call
# testing, local development).
[profile.release-stripped]
inherits = "release"
debug = false
strip = "symbols"

# A-4: workspace-wide lint policy. Each crate opts in via
# `[lints]\nworkspace = true`. Conservative high-signal set —
# pedantic-grade lints (`clippy::pedantic = "warn"`) intentionally
# NOT enabled here; they would produce ~100s of warnings on
# existing code and need a separate clean-up sweep. Ratchet up
# incrementally as the codebase is cleaned.
[workspace.lints.rust]
# 0 unsafe blocks in workspace today (grep-verified) — lock it.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Real-bug lints, not style.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "warn"
mutex_atomic = "warn"
result_large_err = "warn"
