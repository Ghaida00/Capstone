[package]
name = "gn-backend"
version = "0.1.0"
edition = "2021"
description = "High-performance transaction processing backend"

[dependencies]
# Memory allocator — v3 engine: atomic ownership model, first-class heaps
mimalloc = { version = "0.1.48", features = ["v3"], default-features = false }
# Web framework & async runtime
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "compression-gzip", "trace", "timeout"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "bigdecimal", "rust_decimal"] }
bigdecimal = { version = "0.4.10", features = ["serde"] } # Fixed version
rust_decimal = { version = "1.37", features = ["serde-with-str", "maths"] }

# Cache
redis = { version = "1.0.5", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.23"

# Message Queue (RabbitMQ) — native Tokio async
amqprs = { version = "2.1.3", features = ["urispec", "traces"] } # Fixed version
async-trait = "0.1.89" # Fixed version

# Serialization
serde = { version = "1.0.228", features = ["derive"] } # Fixed version
serde_json = "1.0.149"

# Utilities
uuid = { version = "1.22.0", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4.44", features = ["serde"] } # Fixed version
fnv = "1.0.7"
dotenvy = "0.15.7" # Fixed version

# Authentication (gated behind ENABLE_AUTH, off by default)
jsonwebtoken = "9.3.1"
once_cell = "1.20.2"

# Logging & Tracing
tracing = "0.1.44" # Fixed version
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

# OpenTelemetry (semantic observability)
opentelemetry = "0.31.0" # Fixed version
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] } # Fixed version
opentelemetry-stdout = { version = "0.31.0", features = ["trace"] } # Fixed version
tracing-opentelemetry = "0.32.1" # Fixed version

# Prometheus metrics
metrics = "0.24.3" # Fixed version
metrics-exporter-prometheus = "0.18.1"

# Shutdown coordination
tokio-util = { version = "0.7.18", features = ["rt"] } # Fixed version

# Error handling
thiserror = "2.0.18" # Fixed version
anyhow = "1.0.102"

[dev-dependencies]
# Property-based testing
proptest = "1.10.0" # Fixed version
# In-process API testing
axum-test = "19.1.1" # Fixed version
# Hermetic integration tests (ephemeral containers)
testcontainers = "0.27.1" # Fixed version
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
