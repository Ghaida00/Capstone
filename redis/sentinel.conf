# Redis Sentinel Configuration
#
# NOTE (#9): These Sentinels handle automatic failover between redis-master
# and redis-replica. However, the application currently connects
# directly to redis-master:6379 via hardcoded URLs, so Sentinel
# failover will NOT be detected by the app automatically.
# To use Sentinel-aware connections, switch the Redis client to
# query Sentinel for the current master endpoint.

sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor peakload-master redis-master 6379 2
sentinel down-after-milliseconds peakload-master 5000
sentinel failover-timeout peakload-master 10000
sentinel parallel-syncs peakload-master 1
sentinel auth-pass peakload-master peakload_redis_pass
