<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peakload Capstone — Architecture</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-2: #11141b;
    --panel: #15191f;
    --panel-2: #1b1f27;
    --panel-3: #232830;
    --border: #262b34;
    --border-strong: #353c47;
    --text: #e8edf4;
    --text-2: #c2cad6;
    --muted: #8a93a1;
    --dim: #5d6573;
    --accent: #6ea8fe;
    --accent-2: #4f7cc0;
    --success: #7ee787;
    --warn: #f0b341;
    --danger: #ff7b72;
    --code-bg: #0f1218;
    --code-text: #d6dde7;
    --kw: #ff9bd2;
    --str: #a5e1b8;
    --fn: #79c0ff;
    --cmt: #5d6573;
    --num: #f0b341;
    --mq: #d2a8ff;
    --obs: #56d4dd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13.5px/1.5 -apple-system, "Segoe UI", "Inter", Roboto, system-ui, sans-serif;
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header"
      "sidebar canvas";
    overflow: hidden;
  }

  /* ────────────────────────────────────────────── header */
  header {
    grid-area: header;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 14px;
  }
  header .logo {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), #b888f6);
    display: grid; place-items: center;
    font-weight: 800;
    color: #0b0d12;
    font-size: 13px;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.1px; }
  header h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; }
  header .grow { flex: 1; }
  header .meta {
    color: var(--muted);
    font-size: 11.5px;
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-2);
    cursor: pointer;
    text-decoration: none;
  }
  header .meta:hover { border-color: var(--border-strong); color: var(--text-2); }

  /* ────────────────────────────────────────────── sidebar */
  aside {
    grid-area: sidebar;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .search-wrap { padding: 14px; border-bottom: 1px solid var(--border); position: relative; }
  .search-input {
    width: 100%;
    background: var(--bg-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 12px 9px 32px;
    font: inherit;
    font-size: 12.5px;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-wrap::before {
    content: "🔍";
    position: absolute;
    left: 24px; top: 22px;
    opacity: 0.4;
    font-size: 12px;
  }
  .view-list { flex: 1; overflow-y: auto; padding: 10px; }
  .view-list::-webkit-scrollbar { width: 8px; }
  .view-list::-webkit-scrollbar-track { background: transparent; }
  .view-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .view-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px 13px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
    user-select: none;
  }
  .view-card:hover { border-color: var(--border-strong); background: var(--panel-3); }
  .view-card.active {
    border-color: var(--accent);
    background: var(--panel-3);
    box-shadow: 0 0 0 1px var(--accent) inset, 0 4px 14px rgba(110,168,254,0.12);
  }
  .view-card .head { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .view-card .num {
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-weight: 700;
    font-size: 11.5px;
    width: 22px; height: 22px;
    border-radius: 5px;
    display: grid; place-items: center;
    flex-shrink: 0;
    font-family: ui-monospace, Consolas, monospace;
  }
  .view-card.active .num { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .view-card .title { font-weight: 600; font-size: 13px; line-height: 1.3; flex: 1; color: var(--text); }
  .view-card .summary { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .sidebar-foot {
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    color: var(--dim);
    font-size: 11px;
    line-height: 1.5;
  }
  .sidebar-foot code { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; }

  /* ────────────────────────────────────────────── canvas */
  #canvas {
    grid-area: canvas;
    overflow-y: auto;
    overflow-x: auto;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.018) 1px, transparent 0) 0 0/24px 24px,
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    padding: 32px 48px 80px;
  }
  #canvas::-webkit-scrollbar { width: 10px; height: 10px; }
  #canvas::-webkit-scrollbar-track { background: transparent; }
  #canvas::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }

  .view-header { max-width: 1000px; margin-bottom: 24px; display: flex; align-items: flex-start; gap: 16px; }
  .view-header .big-num {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--accent), #b888f6);
    border-radius: 11px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 19px;
    color: #0b0d12;
    flex-shrink: 0;
    font-family: ui-monospace, Consolas, monospace;
  }
  .view-header h2 { margin: 0 0 5px; font-size: 19px; font-weight: 650; }
  .view-header p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; max-width: 760px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .legend .chip {
    font-size: 10.5px;
    font-family: ui-monospace, Consolas, monospace;
    color: var(--text-2);
    border: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: 5px;
    padding: 2.5px 8px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .legend .dot { width: 8px; height: 8px; border-radius: 2.5px; display: inline-block; }

  /* ────────────────────────────────────────────── diagram */
  .diagram {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .diagram svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .diagram .wires path { fill: none; stroke-width: 1.6; }
  .diagram .wires path.flow   { stroke: var(--accent-2); }
  .diagram .wires path.dashed { stroke: var(--dim); stroke-dasharray: 5 4; }
  .diagram .wires path.danger { stroke: var(--danger); stroke-dasharray: 5 4; opacity: 0.75; }
  .diagram .wires path.obs    { stroke: var(--obs); stroke-dasharray: 2.5 4; opacity: 0.7; }
  .diagram .wires text {
    font: 10px ui-monospace, Consolas, monospace;
    fill: var(--muted);
    paint-order: stroke;
    stroke: #15191f;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }

  .node {
    position: absolute;
    background: var(--panel-2);
    border: 1px solid var(--border-strong);
    border-left-width: 3px;
    border-radius: 9px;
    padding: 8px 11px 9px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
    user-select: none;
  }
  .node:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,0.45); border-color: var(--accent); }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, 0 6px 18px rgba(110,168,254,0.18); }
  .node .t { font-weight: 650; font-size: 12.5px; line-height: 1.25; display: flex; align-items: center; gap: 7px; }
  .node .t .step {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 10px; font-weight: 700;
    background: var(--bg-2); color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.5px 5px;
    flex-shrink: 0;
  }
  .node .s { color: var(--muted); font-size: 10.8px; line-height: 1.4; margin-top: 3px; font-family: ui-monospace, Consolas, monospace; }
  .node.ghost { border-style: dashed; opacity: 0.85; background: transparent; }

  .node.p-client { border-left-color: var(--muted); }
  .node.p-edge   { border-left-color: var(--warn); }
  .node.p-app    { border-left-color: var(--accent); }
  .node.p-pg     { border-left-color: var(--success); }
  .node.p-redis  { border-left-color: var(--danger); }
  .node.p-mq     { border-left-color: var(--mq); }
  .node.p-obs    { border-left-color: var(--obs); }
  .node.p-infra  { border-left-color: var(--dim); }

  .plane-label {
    position: absolute;
    font: 600 10px ui-monospace, Consolas, monospace;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--dim);
    pointer-events: none;
  }

  /* ────────────────────────────────────────────── inspector */
  #inspector {
    position: fixed;
    top: 56px; right: 0; bottom: 0;
    width: 400px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    box-shadow: -14px 0 34px rgba(0,0,0,0.45);
    transform: translateX(105%);
    transition: transform 0.16s ease-out;
    display: flex;
    flex-direction: column;
    z-index: 50;
  }
  #inspector.open { transform: translateX(0); }
  #inspector .insp-head {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 10px;
  }
  #inspector .insp-head h3 { margin: 0; font-size: 14.5px; font-weight: 650; flex: 1; line-height: 1.3; }
  #inspector .plane-chip {
    font: 600 9.5px ui-monospace, Consolas, monospace;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-radius: 4px;
    padding: 2px 7px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  #inspector .close {
    background: none; border: 1px solid var(--border);
    color: var(--muted);
    width: 24px; height: 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; line-height: 1;
    flex-shrink: 0;
  }
  #inspector .close:hover { color: var(--text); border-color: var(--border-strong); }
  #inspector .insp-body { flex: 1; overflow-y: auto; padding: 14px 18px 24px; }
  #inspector .insp-body::-webkit-scrollbar { width: 8px; }
  #inspector .insp-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .insp-sec { margin-bottom: 18px; }
  .insp-sec h4 {
    margin: 0 0 8px;
    font: 600 10.5px ui-monospace, Consolas, monospace;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: var(--dim);
  }
  .insp-sec ul { margin: 0; padding: 0 0 0 16px; }
  .insp-sec ul li { color: var(--text-2); font-size: 12.3px; line-height: 1.55; margin-bottom: 6px; }
  .insp-sec ul li code, .sidebar-foot strong {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
    background: var(--code-bg);
    color: var(--code-text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.5px 5px;
  }
  a.file-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
    color: var(--accent);
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 9px;
    text-decoration: none;
    margin: 0 6px 6px 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  a.file-tag:hover { border-color: var(--accent); background: var(--panel-3); }
  a.file-tag .ln { color: var(--num); }
  a.doc-link {
    display: block;
    color: var(--text-2);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 12px;
    text-decoration: none;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  a.doc-link:hover { border-color: var(--accent); color: var(--text); }
  a.doc-link .kind { color: var(--dim); font: 600 9.5px ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: 0.6px; margin-right: 7px; }
  .insp-foot { color: var(--dim); font-size: 10.5px; border-top: 1px solid var(--border); padding-top: 10px; }
</style>
</head>

<header>
  <div class="logo">PC</div>
  <h1>Peakload Capstone — Architecture<small>interactive system views · every number verified against source</small></h1>
  <div class="grow"></div>

<script>
"use strict";

/* ───────────────────────── workspace root (shared with codemap) */
const DEFAULT_ROOT = "c:/Users/Ikhsa/Downloads/MINE/Semester 6/Gh/Capstone";
let WORKSPACE_ROOT = localStorage.getItem("codemapRoot") || DEFAULT_ROOT;

function vscodeUrl(relPath, line) {
  const root = WORKSPACE_ROOT.replace(/\\/g, "/").replace(/\/$/, "");
  const abs = root + "/" + relPath.replace(/\\/g, "/");
  const suffix = line ? (":" + line + ":1") : "";
  return "vscode://file/" + encodeURI(abs) + suffix;
}

const PLANES = {
  client: { label: "client",        color: "var(--muted)"   },
  edge:   { label: "edge",          color: "var(--warn)"    },
  app:    { label: "app",           color: "var(--accent)"  },
  pg:     { label: "postgres",      color: "var(--success)" },
  redis:  { label: "redis",         color: "var(--danger)"  },
  mq:     { label: "rabbitmq",      color: "var(--mq)"      },

const $ = (s) => document.querySelector(s);
let activeView = VIEWS[0];
let selectedNode = null;

function renderSidebar(filter) {
  const list = $("#viewList");
  list.innerHTML = "";
  const q = (filter || "").toLowerCase();
  VIEWS.forEach((v) => {
    const hay = (v.title + " " + v.summary + " " + v.nodes.map(n => n.t + " " + n.s).join(" ")).toLowerCase();
    if (q && !hay.includes(q)) return;
    const card = document.createElement("div");
    card.className = "view-card" + (v === activeView ? " active" : "");
    card.innerHTML =
      '<div class="head"><div class="num">' + v.num + '</div><div class="title">' + v.title + '</div></div>' +
      '<div class="summary">' + v.summary + '</div>';
    card.onclick = () => { activeView = v; closeInspector(); renderSidebar($("#search").value); renderView(); };
    list.appendChild(card);
  });
}

function legendHtml() {
  let chips = "";
  for (const k in PLANES) {
    chips += '<span class="chip"><span class="dot" style="background:' + PLANES[k].color + '"></span>' + PLANES[k].label + '</span>';
  }
  return '<div class="legend">' + chips + '</div>';
}

function renderView() {
  const c = $("#canvas");
  c.innerHTML = "";

  const head = document.createElement("div");
  head.className = "view-header";
  head.innerHTML =
    '<div class="big-num">' + activeView.num + '</div>' +
    '<div><h2>' + activeView.title + '</h2><p>' + activeView.summary + '</p></div>';
  c.appendChild(head);

  const lg = document.createElement("div");
  lg.innerHTML = legendHtml();
  c.appendChild(lg.firstChild);

  const dia = document.createElement("div");
  dia.className = "diagram";
  dia.style.width = activeView.w + "px";
  dia.style.height = activeView.h + "px";

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "wires");
  svg.innerHTML =
    '<defs>' +
    '<marker id="arr-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f7cc0"/></marker>' +
    '<marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6573"/></marker>' +
    '<marker id="arr-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7b72"/></marker>' +
    '<marker id="arr-obs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56d4dd"/></marker>' +
    '</defs>';
  dia.appendChild(svg);

  (activeView.planes || []).forEach((p) => {
    const el = document.createElement("div");
    el.className = "plane-label";
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    el.textContent = p.text;
    dia.appendChild(el);
  });

  activeView.nodes.forEach((n) => {
    const el = document.createElement("div");
    el.className = "node p-" + n.plane + (n.ghost ? " ghost" : "");
    el.id = "n-" + n.id;
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.style.width = n.w + "px";
    el.innerHTML =
      '<div class="t">' + (n.step ? '<span class="step">' + n.step + '</span>' : '') + n.t + '</div>' +
      (n.s ? '<div class="s">' + n.s + '</div>' : '');
    el.onclick = (ev) => { ev.stopPropagation(); openInspector(n); };
    dia.appendChild(el);
  });

  c.appendChild(dia);
  requestAnimationFrame(() => drawEdges(svg, dia));
}

function rectOf(dia, id) {
  const el = dia.querySelector("#n-" + id);
  return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
}
function anchor(r, side) {
  switch (side) {
    case "top":    return { x: r.x + r.w / 2, y: r.y, nx: 0, ny: -1 };
    case "bottom": return { x: r.x + r.w / 2, y: r.y + r.h, nx: 0, ny: 1 };
    case "left":   return { x: r.x, y: r.y + r.h / 2, nx: -1, ny: 0 };
    default:       return { x: r.x + r.w, y: r.y + r.h / 2, nx: 1, ny: 0 };
  }
}
function autoSides(a, b) {
  const acx = a.x + a.w / 2, acy = a.y + a.h / 2;
  const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
  const dx = bcx - acx, dy = bcy - acy;
  if (Math.abs(dy) >= Math.abs(dx)) {
    return dy > 0 ? ["bottom", "top"] : ["top", "bottom"];
  }
  return dx > 0 ? ["right", "left"] : ["left", "right"];
}
function drawEdges(svg, dia) {
  const NS = "http://www.w3.org/2000/svg";
  activeView.edges.forEach((e) => {
    const ra = rectOf(dia, e.from), rb = rectOf(dia, e.to);
    const sides = autoSides(ra, rb);
    const sa = anchor(ra, e.fromSide || sides[0]);
    const sb = anchor(rb, e.toSide || sides[1]);
    const dist = Math.hypot(sb.x - sa.x, sb.y - sa.y);
    const k = Math.min(64, Math.max(28, dist * 0.38));
    const c1x = sa.x + sa.nx * k, c1y = sa.y + sa.ny * k;
    const c2x = sb.x + sb.nx * k, c2y = sb.y + sb.ny * k;
    const kind = e.kind || "flow";
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", "M " + sa.x + " " + sa.y + " C " + c1x + " " + c1y + ", " + c2x + " " + c2y + ", " + sb.x + " " + sb.y);
    p.setAttribute("class", kind);
    p.setAttribute("marker-end", "url(#arr-" + kind + ")");
    svg.appendChild(p);
    if (e.label) {
      const t = 0.5;
      const mt = 1 - t;
      const mx = mt*mt*mt*sa.x + 3*mt*mt*t*c1x + 3*mt*t*t*c2x + t*t*t*sb.x;
      const my = mt*mt*mt*sa.y + 3*mt*mt*t*c1y + 3*mt*t*t*c2y + t*t*t*sb.y;
      const txt = document.createElementNS(NS, "text");
      txt.setAttribute("x", mx);
      txt.setAttribute("y", my - 4);
      txt.setAttribute("text-anchor", "middle");
      txt.textContent = e.label;
      svg.appendChild(txt);
    }
  });
}

/* ───────────────────────── inspector */
function openInspector(n) {
  const d = DETAILS[n.id];
  document.querySelectorAll(".node.sel").forEach((el) => el.classList.remove("sel"));
  const nodeEl = document.getElementById("n-" + n.id);
  if (nodeEl) nodeEl.classList.add("sel");
  selectedNode = n.id;

  $("#inspTitle").textContent = n.t;
  const plane = PLANES[(d && d.plane) || n.plane];
  const chip = $("#inspPlane");
  chip.textContent = plane.label;
  chip.style.color = plane.color;
  chip.style.border = "1px solid " + plane.color;
  chip.style.background = "transparent";

  let html = "";
  if (d && d.facts && d.facts.length) {
    html += '<div class="insp-sec"><h4>Facts</h4><ul>' + d.facts.map((f) => "<li>" + f + "</li>").join("") + "</ul></div>";
  }
  if (d && d.code && d.code.length) {
    html += '<div class="insp-sec"><h4>Code</h4>' + d.code.map((c) => {
      const label = c[2] ? ' · <span style="color:var(--muted)">' + c[2] + "</span>" : "";
      const ln = c[1] ? '<span class="ln">:' + c[1] + "</span>" : "";
      return '<a class="file-tag" href="' + vscodeUrl(c[0], c[1]) + '">' + c[0] + ln + label + "</a>";
    }).join("") + "</div>";
  }
  if (d && d.docs && d.docs.length) {
    html += '<div class="insp-sec"><h4>Decisions &amp; Runbooks</h4>' + d.docs.map((doc) => {
      const kind = doc[0].includes("/adr/") ? "ADR" : doc[0].includes("/runbooks/") ? "RUNBOOK" : "DOC";
      return '<a class="doc-link" href="' + vscodeUrl(doc[0], null) + '"><span class="kind">' + kind + "</span>" + doc[1] + "</a>";
    }).join("") + "</div>";
  }
  html += '<div class="insp-foot">Facts verified against source 2026-06-10 · links open in VS Code (root configurable in header, shared with the codemap).</div>';
  $("#inspBody").innerHTML = html;
  $("#inspector").classList.add("open");
}
function closeInspector() {
  $("#inspector").classList.remove("open");
  document.querySelectorAll(".node.sel").forEach((el) => el.classList.remove("sel"));
  selectedNode = null;
}

/* ───────────────────────── wiring */
$("#inspClose").onclick = closeInspector;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeInspector(); });
$("#canvas").addEventListener("click", (e) => { if (!e.target.closest(".node")) closeInspector(); });
$("#search").addEventListener("input", (e) => renderSidebar(e.target.value));

  const v = prompt("Workspace root for vscode:// links (shared with codemap):", WORKSPACE_ROOT);
  if (v) {
    WORKSPACE_ROOT = v.trim();
    localStorage.setItem("codemapRoot", WORKSPACE_ROOT);
    refreshRootBtn();
    if (selectedNode) {
      const n = activeView.nodes.find((x) => x.id === selectedNode);
      if (n) openInspector(n);
    }
  }
};
refreshRootBtn();

renderSidebar("");
renderView();
</script>
</body>
</html>
