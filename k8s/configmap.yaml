apiVersion: v1
kind: ConfigMap
metadata:
  name: peakload-api-config
  namespace: peakload
data:
  APP_HOST: "0.0.0.0"
  APP_PORT: "3000"
  RUST_LOG: "warn"
  ENABLE_AUTH: "false"
  CORS_ALLOWED_ORIGINS: "*"

  # Local POC tuning mirrors the Docker Compose defaults closely enough
  # to exercise the API without moving its dependencies into Kubernetes.
  DB_WRITE_POOL_SIZE: "60"
  DB_READ_POOL_SIZE: "80"
  DB_QUERY_TIMEOUT_SECS: "2"
  DB_HEALTH_CHECK_INTERVAL_SECS: "5"
  DB_WRITE_RETRY_MAX_ATTEMPTS: "6"
  DB_WRITE_RETRY_BACKOFF_MS: "200"
  REDIS_POOL_SIZE: "50"
  REDIS_COMMAND_TIMEOUT_SECS: "1"
  REDIS_SENTINEL_MASTER_NAME: "peakload-master"
  REDIS_SENTINEL_MONITOR_INTERVAL_SECS: "5"
  API_TIMEOUT_SECS: "10"
  RATE_LIMIT_PER_SECOND: "10000"
  RATE_LIMIT_BURST: "20000"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "50"
  CIRCUIT_BREAKER_RECOVERY_TIMEOUT_SECS: "10"
  MAX_CONCURRENT_REQUESTS: "2000"
  BACKPRESSURE_WAIT_MS: "50"
  TX_VERIFY_FROM_ACCOUNT: "false"
  IDEMPOTENCY_BACKEND: "hybrid"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://peakload-jaeger:4317"
  OTEL_SERVICE_NAME: "peakload-backend"
