apiVersion: apps/v1
kind: Deployment
metadata:
  name: peakload-api
  namespace: peakload
  labels:
    app.kubernetes.io/name: peakload-api
    app.kubernetes.io/part-of: peakload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: peakload-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peakload-api
        app.kubernetes.io/part-of: peakload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: peakload-capstone:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: peakload-api-config
            - secretRef:
                name: peakload-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
