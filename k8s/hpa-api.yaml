apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: peakload-api
  namespace: peakload
  labels:
    app.kubernetes.io/name: peakload-api
    app.kubernetes.io/part-of: peakload
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: peakload-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
