groups:
  - name: peakload-sli
    interval: 30s
    rules:
      - record: peakload:http_requests:rate5m
        expr: sum(rate(http_requests_total[5m]))
      - record: peakload:http_errors:rate5m
        expr: sum(rate(http_requests_total{http_response_status_code=~"5.."}[5m]))
      - record: peakload:http_availability:ratio_rate5m
        expr: 1 - (peakload:http_errors:rate5m / clamp_min(peakload:http_requests:rate5m, 1))
      - record: peakload:http_latency_under_slo:ratio_rate5m
        expr: |
          sum(rate(http_request_duration_seconds_bucket{le="0.5"}[5m]))
            / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 1)
