worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    # ─── Performance ─────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # ─── Buffers ─────────────────────────────────────────
    client_body_buffer_size 16k;
    client_max_body_size 8m;
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_busy_buffers_size 16k;

    # Compression off at proxy level (edge responsibility)
    gzip off;

    # ─── Response Cache ──────────────────────────────────
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=2s;

    # ─── Rate Limiting Zones ────────────────────────────
    limit_req_zone $binary_remote_addr zone=per_ip:20m rate=2000r/s;
    limit_req_zone $server_name zone=global:2m rate=50000r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ─── Logging ────────────────────────────────────────
    access_log off;
    error_log /var/log/nginx/error.log error;

    # ─── Upstream ───────────────────────────────────────
    upstream rust_backend {
        least_conn;
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 128;
        keepalive_timeout 60s;
        keepalive_requests 10000;
    }

    # ─── Server ─────────────────────────────────────────
    server {
        listen 80;
        http2 on;
        server_name _;

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"rate_limited","message":"Too many requests"}';
        }

        # Health (no rate limit, no cache)
        location = /health {
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Metrics (no rate limit, no cache)
        location = /metrics {
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # GET API routes (cached 1s, rate limited)
        location ~ ^/api/v1/transactions$ {
            limit_req zone=per_ip burst=500 nodelay;
            limit_req zone=global burst=20000 nodelay;
            limit_conn conn_per_ip 500;

            # Cache GET responses for 1 second
            proxy_cache api_cache;
            proxy_cache_valid 200 1s;
            proxy_cache_methods GET;
            proxy_cache_key "$request_method$request_uri";
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        # All other API routes (no cache, rate limited)
        location /api/ {
            limit_req zone=per_ip burst=500 nodelay;
            limit_req zone=global burst=20000 nodelay;
            limit_conn conn_per_ip 500;
            
            # Stream request body directly to upstream, do not buffer to disk
            proxy_request_buffering off;

            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        location / {
            return 404 '{"error":"not_found","message":"Route not found"}';
            default_type application/json;
        }
    }
}
