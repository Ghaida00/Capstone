# Dashboard: static demo UI served from /var/www/dashboard/. The
# global CSP `default-src 'none'` is overridden ONLY for this prefix —
# every API route keeps the locked-down default. Mounted by the
# docker-compose.dashboard.yml override file; the base bring-up
# (`docker compose up -d`) leaves this dir empty so the include below
# matches nothing and the dashboard is fully detached.
#
# Detach completely:
#   rm -rf dashboard/ nginx/server.d/ docker-compose.dashboard.yml
# The two `include` lines in nginx.conf.template stay — they're
# benign best-practice patterns that no-op when their target dirs
# are empty.

location /dashboard/ {
    alias /var/www/dashboard/;
    index index.html;
    try_files $uri $uri/ /dashboard/index.html;

    # CSP value must be a single quoted argument — nginx does NOT
    # concatenate adjacent strings the way C does.
    #
    # script-src needs BOTH 'unsafe-eval' AND 'unsafe-inline':
    #   'unsafe-eval'    — Babel-standalone uses Function() to transpile.
    #   'unsafe-inline'  — Babel-standalone injects the transpiled
    #                      output back into the DOM as an inline
    #                      <script>. Without this, the browser blocks
    #                      every transpiled JSX module.
    # A prod variant would pre-compile JSX with Babel CLI and need
    # neither relaxation.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # No expires header — ETag + Last-Modified handle revalidation.
    # Aggressive caching here just creates "why is my CSS update not
    # showing" pain when iterating on the dashboard.
    add_header Cache-Control "no-cache" always;
}
