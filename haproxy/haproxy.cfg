# ============================================================
# Role-aware TCP proxy for Postgres writes
# ============================================================
#
# Single HAProxy instance with three frontends — one per shard.
# Each frontend's backend contains BOTH nodes of that shard
# (pg-shardN-node-a and -node-b). HAProxy health-probes each
# node on :8008 — Patroni's built-in REST API — and only routes
# writes to whichever node answers HTTP 200 on GET /primary.
#
# When Patroni promotes the replica (triggered by etcd lease
# loss on the old primary), the old primary starts returning
# HTTP 503 on /primary and the new primary starts returning 200.
# HAProxy marks the old one DOWN, closes its sessions
# (on-marked-down shutdown-sessions), and forwards all new
# connections to the promoted node. pgBouncer's server pool
# rebuilds on the next client acquire — no reload required.
#
# Port map:
#   :5000  →  shard 0 current primary
#   :5001  →  shard 1 current primary
#   :5002  →  shard 2 current primary
#   :7000  →  HAProxy stats (HTTP)
#
# This file is orchestrator-agnostic in practice: the same
# `GET /primary` + 200/503 protocol is served both by Patroni
# natively and by the earlier pg_auto_failover + socat sidecar
# we removed. Swapping Patroni for a future tool requires
# NO edits here as long as the replacement offers the same
# HTTP health endpoint on :8008.
# ============================================================

global
    log         stdout format raw local0
    maxconn     4096
    daemon      off
    # HAProxy 2.4+ logs to stdout when explicitly told; keeps
    # "docker compose logs pg-haproxy" useful.

defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    option                  redispatch
    retries                 2
    timeout connect         5s
    # Allow idle pgBouncer↔PG server connections up to 30 min;
    # pgBouncer itself already caps server_lifetime at 3600s.
    timeout client          30m
    timeout server          30m
    # Health-check requests are HTTP even though the traffic is
    # TCP — httpchk stays cheap thanks to Connection: close in
    # the healthcheck response.
    timeout check           5s

# ------------------------------------------------------------
# Stats
# ------------------------------------------------------------
# Useful during incident response: open http://localhost:7000/
# to see per-backend health, session counts, and last state
# change. Read-only, no auth — container is not port-exposed
# to the host by default (see docker-compose.yml).
# ------------------------------------------------------------
frontend stats
    mode    http
    bind    *:7000
    stats   enable
    stats   uri /
    stats   refresh 5s
    stats   show-node

# ------------------------------------------------------------
# Shared backend options via default-server
# ------------------------------------------------------------
# Put the common knobs in each backend's default-server line:
#
#   check port 8008          — health probe hits the sidecar
#   inter 2s                 — probe every 2 seconds
#   fall 2                   — 2 consecutive failures → DOWN
#   rise 2                   — 2 consecutive successes → UP
#   on-marked-down shutdown-sessions
#                            — sever existing conns on demote
#                              so pgBouncer rebuilds its pool
#   weight 100               — equal weight; HAProxy picks the
#                              single healthy backend anyway
# ------------------------------------------------------------

# ========== SHARD 0 ==========
frontend fe_shard0_primary
    bind    *:5000
    default_backend be_shard0_primary

backend be_shard0_primary
    option  httpchk GET /primary HTTP/1.0
    http-check expect status 200
    default-server check port 8008 inter 2s fall 2 rise 2 \
                   on-marked-down shutdown-sessions
    server  node_a pg-shard0-node-a:5432 weight 100
    server  node_b pg-shard0-node-b:5432 weight 100

# ========== SHARD 1 ==========
frontend fe_shard1_primary
    bind    *:5001
    default_backend be_shard1_primary

backend be_shard1_primary
    option  httpchk GET /primary HTTP/1.0
    http-check expect status 200
    default-server check port 8008 inter 2s fall 2 rise 2 \
                   on-marked-down shutdown-sessions
    server  node_a pg-shard1-node-a:5432 weight 100
    server  node_b pg-shard1-node-b:5432 weight 100

# ========== SHARD 2 ==========
frontend fe_shard2_primary
    bind    *:5002
    default_backend be_shard2_primary

backend be_shard2_primary
    option  httpchk GET /primary HTTP/1.0
    http-check expect status 200
    default-server check port 8008 inter 2s fall 2 rise 2 \
                   on-marked-down shutdown-sessions
    server  node_a pg-shard2-node-a:5432 weight 100
    server  node_b pg-shard2-node-b:5432 weight 100
