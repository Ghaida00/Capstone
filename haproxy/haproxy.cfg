# ============================================================
# Role-aware TCP proxy for Postgres reads and writes
# ============================================================
#
# Single HAProxy instance with three frontends — one per shard.
# Each frontend's backend contains BOTH nodes of that shard
# (pg-shardN-node-a and -node-b). HAProxy health-probes each
# node on :8008 — Patroni's built-in REST API — and only routes
# writes to whichever node answers HTTP 200 on GET /primary.
#
# Shard 0 is always present; shards 1 and 2 are profile-gated
# (Compose profiles `shard1` / `shard2`). The `resolvers docker`
# block below + `init-addr last,libc,none` on those backends'
# servers makes HAProxy boot cleanly without them and pick them
# up automatically when the profile is later activated.
#
# When Patroni promotes the replica (triggered by etcd lease
# loss on the old primary), the old primary starts returning
# HTTP 503 on /primary and the new primary starts returning 200.
# HAProxy marks the old one DOWN, closes its sessions
# (on-marked-down shutdown-sessions), and forwards all new
# connections to the promoted node. pgBouncer's server pool
# rebuilds on the next client acquire — no reload required.
#
# Port map:
#   :5000  →  shard 0 current primary    :5010  →  shard 0 current replica
#   :5001  →  shard 1 current primary    :5011  →  shard 1 current replica
#   :5002  →  shard 2 current primary    :5012  →  shard 2 current replica
#   :7000  →  HAProxy stats (HTTP)
#
# Write frontends probe GET /primary; read frontends probe
# GET /replica, so only the current replica serves reads and the
# primary is kept read-free. During a promotion both nodes briefly
# fail /replica and reads error until the new replica settles —
# symmetric with the /primary flip; clients retry.
#
# This file is orchestrator-agnostic in practice: the same
# `GET /primary` + 200/503 protocol is served both by Patroni
# natively and by the earlier pg_auto_failover + socat sidecar
# we removed. Swapping Patroni for a future tool requires
# NO edits here as long as the replacement offers the same
# HTTP health endpoint on :8008.
# ============================================================

global
    log         stdout format raw local0
    maxconn     4096
    # No `daemon` directive — HAProxy 3.x rejects `daemon off`
    # and runs in foreground by default when omitted, which is
    # what we want under Docker so PID 1 is HAProxy itself.
    # HAProxy 2.4+ logs to stdout when explicitly told; keeps
    # "docker compose logs pg-haproxy" useful.

defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    option                  redispatch
    retries                 2
    timeout connect         5s
    # Allow idle pgBouncer↔PG server connections up to 30 min;
    # pgBouncer itself already caps server_lifetime at 3600s.
    timeout client          30m
    timeout server          30m
    # Health-check requests are HTTP even though the traffic is
    # TCP — httpchk stays cheap thanks to Connection: close in
    # the healthcheck response.
    timeout check           5s

# ------------------------------------------------------------
# Stats
# ------------------------------------------------------------
# Useful during incident response: open http://localhost:7000/
# to see per-backend health, session counts, and last state
# change. Read-only, no auth — container is not port-exposed
# to the host by default (see docker-compose.yml).
# ------------------------------------------------------------
frontend stats
    mode    http
    bind    *:7000
    stats   enable
    stats   uri /
    stats   refresh 5s
    stats   show-node

# ------------------------------------------------------------
# Docker DNS resolver — for profile-gated shards
# ------------------------------------------------------------
# Shards 1 and 2 are activated via COMPOSE_PROFILES. When their
# services are not running, the `pg-shardN-node-*` hostnames do
# not resolve. Without `init-addr none + resolvers docker`,
# HAProxy refuses to start because backend server resolution
# fails at boot.
#
# This block teaches HAProxy to query Docker's embedded DNS
# (127.0.0.11) and re-poll it on the cadence below. Combined with
# `init-addr last,libc,none` on each profile-gated server, the
# proxy boots with those servers in "no address" / DOWN state and
# picks them up automatically once the shard's pods come online
# — no HAProxy restart required to flip topologies.
# ------------------------------------------------------------
resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 10s
    hold other 30s
    hold refused 30s
    hold nx 30s
    hold timeout 30s
    resolve_retries 3

# ------------------------------------------------------------
# Shared backend options via default-server
# ------------------------------------------------------------
# Put the common knobs in each backend's default-server line:
#
#   check port 8008          — health probe hits the sidecar
#   inter 2s                 — probe every 2 seconds
#   fall 2                   — 2 consecutive failures → DOWN
#   rise 2                   — 2 consecutive successes → UP
#   on-marked-down shutdown-sessions
#                            — sever existing conns on demote
#                              so pgBouncer rebuilds its pool
#   weight 100               — equal weight; HAProxy picks the
#                              single healthy backend anyway
# ------------------------------------------------------------

# ========== SHARD 0 ==========
# Always-on. Hostnames resolve at HAProxy startup; no need for
# the docker resolver / init-addr fallback that shards 1 and 2
# use.
frontend fe_shard0_primary
    bind    *:5000
    default_backend be_shard0_primary

backend be_shard0_primary
    option  httpchk GET /primary HTTP/1.0
    http-check expect status 200
    # NOTE: HAProxy 3.x does not support `\` line continuation
    # — keep `default-server` directives on a single line.
    default-server check port 8008 inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server  node_a pg-shard0-node-a:5432 weight 100
    server  node_b pg-shard0-node-b:5432 weight 100

# ========== SHARD 1 ==========
# Profile-gated (`shard1`). Servers use `resolvers docker` +
# `init-addr last,libc,none` so HAProxy boots cleanly when the
# profile is inactive (backend stays DOWN, nothing routes to
# :5001) and starts forwarding automatically once the nodes
# appear.
frontend fe_shard1_primary
    bind    *:5001
    default_backend be_shard1_primary

backend be_shard1_primary
    option  httpchk GET /primary HTTP/1.0
    http-check expect status 200
    default-server check port 8008 inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server  node_a pg-shard1-node-a:5432 weight 100
    server  node_b pg-shard1-node-b:5432 weight 100

# ========== SHARD 2 ==========
# Profile-gated (`shard2`). Same resolver fallback as shard 1.
# Enabling shard 2 requires shard 1 also enabled (contiguity rule
# enforced by Config::validate at app boot).
frontend fe_shard2_primary
    bind    *:5002
    default_backend be_shard2_primary

backend be_shard2_primary
    option  httpchk GET /primary HTTP/1.0
    http-check expect status 200
    default-server check port 8008 inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server  node_a pg-shard2-node-a:5432 weight 100
    server  node_b pg-shard2-node-b:5432 weight 100

# ============================================================
# READ FRONTENDS — route reads to the current replica
# ============================================================
# Same node pairs as the write frontends, but health-probe
# GET /replica so only the node currently in the REPLICA role
# receives reads. Keeps read load off the primary. Shard 0 is
# always-on; shards 1/2 reuse the docker resolver + init-addr
# fallback so they boot DOWN until their profile activates.
# ============================================================

# ========== SHARD 0 READS ==========
frontend fe_shard0_replica
    bind    *:5010
    default_backend be_shard0_replica

backend be_shard0_replica
    option  httpchk GET /replica HTTP/1.0
    http-check expect status 200
    default-server check port 8008 inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server  node_a pg-shard0-node-a:5432 weight 100
    server  node_b pg-shard0-node-b:5432 weight 100

# ========== SHARD 1 READS ==========
frontend fe_shard1_replica
    bind    *:5011
    default_backend be_shard1_replica

backend be_shard1_replica
    option  httpchk GET /replica HTTP/1.0
    http-check expect status 200
    default-server check port 8008 inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server  node_a pg-shard1-node-a:5432 weight 100
    server  node_b pg-shard1-node-b:5432 weight 100

# ========== SHARD 2 READS ==========
frontend fe_shard2_replica
    bind    *:5012
    default_backend be_shard2_replica

backend be_shard2_replica
    option  httpchk GET /replica HTTP/1.0
    http-check expect status 200
    default-server check port 8008 inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server  node_a pg-shard2-node-a:5432 weight 100
    server  node_b pg-shard2-node-b:5432 weight 100
