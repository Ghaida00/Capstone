<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Peakload Capstone · Ops</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Fonts: self-hosted woff2, no Google Fonts. unicode-range
       narrows which font file is downloaded based on the codepoint
       range needed; the page only ever pulls latin in practice
       but the extra @font-face entries cost no bandwidth (each
       is a fresh URL the browser fetches lazily). -->
  <style>
    @font-face {
      font-family: 'Instrument Sans';
      font-style: normal; font-weight: 400 700;
      font-display: swap;
      src: url('fonts/InstrumentSans-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Instrument Sans';
      font-style: normal; font-weight: 400 700;
      font-display: swap;
      src: url('fonts/InstrumentSans-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal; font-weight: 400 600;
      font-display: swap;
      src: url('fonts/JetBrainsMono-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal; font-weight: 400 600;
      font-display: swap;
      src: url('fonts/JetBrainsMono-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
  </style>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <!-- Vendored React + Babel. Loaded as classic scripts so they
       attach their globals (React, ReactDOM, Babel) before any
       text/babel JSX is transpiled. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <!-- Kernels: dual-target IIFEs that attach to window.PL. Loaded
       as classic scripts (no Babel transpile needed) so they're
       ready before any text/babel script reads from window.PL. -->
  <script src="src/metrics.js"></script>
  <script src="src/burst.js"></script>
  <script src="src/api.js"></script>

  <!-- JSX: Babel-standalone transpiles these in-browser. The
       `data-presets` attribute is the standalone-specific way to
       request preset-react without a separate Babel config. -->
  <script type="text/babel" data-presets="react" src="src/components.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/app.jsx"></script>
</body>
</html>
