[package]
name = "transactions"
version = "0.1.0"
edition = "2021"
description = "Bounded context: money movement (depends on accounts via ports)."
# Internal workspace crate — never published. Marks this for
# cargo-deny's `[licenses.private] ignore = true` rule (WP4).
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
shared_kernel = { path = "../shared_kernel" }
accounts = { path = "../accounts" }

axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
amqprs = { workspace = true }

sqlx = { workspace = true }
rust_decimal = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
fnv = { workspace = true }
sha2 = { workspace = true }

tracing = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
metrics = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
notifications = { path = "../notifications" }
axum-test = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
# T-2: property-based tests for the request_hash / idempotency_key /
# validate_amount invariants. These are the financial-correctness
# properties the audit named as the highest-value proptest targets
# (SHA-256 injectivity, DECIMAL(18,2) scale, key uniqueness).
proptest = { workspace = true }

[lints]
workspace = true
