[package]
name = "shared_kernel"
version = "0.1.0"
edition = "2021"
description = "Cross-cutting infrastructure (DB, cache, queue, errors, events) shared by every business module."
# Internal workspace crate — never published. Marks this for
# cargo-deny's `[licenses.private] ignore = true` rule (WP4).
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Web (axum::IntoResponse on AppError + ApiResponse types)
axum = { workspace = true }
tower = { workspace = true }

# Async runtime — broadcast bus + retry helpers
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

# Database
sqlx = { workspace = true }
bigdecimal = { workspace = true }
rust_decimal = { workspace = true }

# Cache
redis = { workspace = true }
deadpool-redis = { workspace = true }

# Queue
amqprs = { workspace = true }

# Serde
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
fnv = { workspace = true }
url = { workspace = true }

# Logging
tracing = { workspace = true }

# OpenTelemetry — W3C trace-context propagation across the AMQP boundary
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Metrics (failover counters live in db/)
metrics = { workspace = true }

# Error handling
thiserror = { workspace = true }
# A-2: anyhow removed — the two Sentinel helpers that used it now
# return Result<_, AppError>. anyhow stays a workspace dep for the
# binary's anyhow::Result<()> at the app::run boundary, but no
# library crate depends on it. `thiserror` for libraries, `anyhow`
# for applications — community convention.

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
