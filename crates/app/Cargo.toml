[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "Peakload Capstone — composition root binary. Wires every module crate."
# Internal workspace binary — never published. Marks this for
# cargo-deny's `[licenses.private] ignore = true` rule (WP4).
publish = false

[[bin]]
name = "peakload-capstone"
path = "src/main.rs"

[dependencies]
shared_kernel = { path = "../shared_kernel" }
accounts = { path = "../accounts" }
transactions = { path = "../transactions" }
notifications = { path = "../notifications" }

# Allocator
mimalloc = { workspace = true }

# Web
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

# DB / cache (consumed by middleware)
sqlx = { workspace = true }
rust_decimal = { workspace = true }
redis = { workspace = true }
deadpool-redis = { workspace = true }

# Serde
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
fnv = { workspace = true }
dotenvy = { workspace = true }

# Auth middleware
jsonwebtoken = { workspace = true }
once_cell = { workspace = true }

# Logging / tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# proptest used to live here but no proptest! block in `app` exercised
# it (T-2). The shared_kernel router properties and the transactions
# domain properties cover the workspace's property-test surface; this
# crate adds the dep back the day a property arrives.
axum-test = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true
