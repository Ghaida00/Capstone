# OTel Collector — Peakload Capstone
#
# Receives OTLP/gRPC from app instances, batches, and fans every trace
# out to two exporters:
#   - otlp:  forwards to the `jaeger` service, which stores spans and
#            serves the searchable trace UI at http://localhost:16686.
#            This is the primary observation surface.
#   - debug: prints full span detail to stdout (visible via
#            `docker logs peakload-otel-collector`) as a
#            no-dependency observation surface alongside Jaeger.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlp:
    endpoint: jaeger:4317
    # Jaeger's OTLP gRPC listener is plaintext on the internal Docker
    # network — no TLS to negotiate.
    tls:
      insecure: true
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, debug]
